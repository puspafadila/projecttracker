function AppRoot() {
  const stored = loadState() || {};
  const [currentUser, setCurrentUser] = useState(stored.currentUser || null);
  const [activeView, setActiveView] = useState(stored.activeView || "list");
  const [sidebarCollapsed, setSidebarCollapsed] = useState(!!stored.sidebarCollapsed);
  const onToggleSidebar = () => setSidebarCollapsed(c => !c);
  const [projectList, setProjectList] = useState(stored.projectList || []);
  const [records, setRecords] = useState(stored.records || {});
  const [baselineRecords, setBaselineRecords] = useState(stored.baselineRecords || {});
  const [masterData, setMasterData] = useState({ ...DEFAULT_MASTER_DATA, ...(stored.masterData || {}) });
  const [userManagement, setUserManagement] = useState(stored.userManagement || DEFAULT_USER_MANAGEMENT);
  const [weeklyReports, setWeeklyReports] = useState(stored.weeklyReports || []);
  const [remoteLoading, setRemoteLoading] = useState(!!supabaseClient);
  const remoteHydrated = useRef(false);
  const [createProjectForm, setCreateProjectForm] = useState({ application:"", deliveryModel:"", project:"", resource:"", mountain:"", stream:"", subStream:"", startDate:"", endDate:"", tpo:"", deliveryLead:"", priority:"", phase:"" });
  const [cmApplicationText, setCmApplicationText] = useState(stored.lastCmApplication || "");
  const [cmProjectText, setCmProjectText] = useState(stored.lastCmProject || "");
  const [changeManagementRecords, setChangeManagementRecords] = useState(stored.changeManagementRecords || {});
  const [wizardStep, setWizardStep] = useState(1);
  const [applicationText, setApplicationText] = useState(stored.lastApplication || "");
  const [projectText, setProjectText] = useState(stored.lastProject || "");
  const [baselineApplicationText, setBaselineApplicationText] = useState(stored.lastBaselineApplication || "");
  const [baselineProjectText, setBaselineProjectText] = useState(stored.lastBaselineProject || "");
  const [taskColumnOrder, setTaskColumnOrder] = useState(stored.taskColumnOrder || DEFAULT_TASK_ORDER);
  const [taskHiddenColumns, setTaskHiddenColumns] = useState(stored.taskHiddenColumns || []);
  const [todoHiddenColumns, setTodoHiddenColumns] = useState(stored.todoHiddenColumns || []);
  const [plColumnOrder, setPlColumnOrder] = useState(stored.plColumnOrder || DEFAULT_PL_COLUMN_ORDER);
  const [plHiddenColumns, setPlHiddenColumns] = useState(stored.plHiddenColumns || []);
  const [taskGanttHidden, setTaskGanttHidden] = useState(!!stored.taskGanttHidden);
  const [plGanttHidden, setPlGanttHidden] = useState(!!stored.plGanttHidden);
  const [sortConfig, setSortConfig] = useState({ key:null, dir:"asc" });
  const [plSortConfig, setPlSortConfig] = useState({ key:null, dir:"asc" });
  const [saveStatus, setSaveStatus] = useState("idle");
  const mounted = useRef(false);
  const picListId = "pic-suggest";

  // Pull the shared/collaborative data from Supabase on load, then keep it in
  // sync in real time as other users make changes. No-op when Supabase isn't
  // configured (SUPABASE_URL left empty) — the app just runs local-only.
  useEffect(() => {
    if (!supabaseClient) return;
    let cancelled = false;
    fetchRemoteState().then(remote => {
      if (cancelled) return;
      if (remote) {
        if (remote.projectList !== undefined) setProjectList(remote.projectList);
        if (remote.records !== undefined) setRecords(remote.records);
        if (remote.baselineRecords !== undefined) setBaselineRecords(remote.baselineRecords);
        if (remote.changeManagementRecords !== undefined) setChangeManagementRecords(remote.changeManagementRecords);
        if (remote.masterData !== undefined) setMasterData({ ...DEFAULT_MASTER_DATA, ...remote.masterData });
        if (remote.userManagement !== undefined) setUserManagement(remote.userManagement);
        if (remote.weeklyReports !== undefined) setWeeklyReports(remote.weeklyReports);
      }
      remoteHydrated.current = true;
      setRemoteLoading(false);
    });
    const unsubscribe = subscribeRemoteState(remote => {
      if (remote.projectList !== undefined) setProjectList(remote.projectList);
      if (remote.records !== undefined) setRecords(remote.records);
      if (remote.baselineRecords !== undefined) setBaselineRecords(remote.baselineRecords);
      if (remote.changeManagementRecords !== undefined) setChangeManagementRecords(remote.changeManagementRecords);
      if (remote.masterData !== undefined) setMasterData({ ...DEFAULT_MASTER_DATA, ...remote.masterData });
      if (remote.userManagement !== undefined) setUserManagement(remote.userManagement);
      if (remote.weeklyReports !== undefined) setWeeklyReports(remote.weeklyReports);
    });
    return () => { cancelled = true; unsubscribe(); };
  }, []);

  const key = useMemo(() => makeKey(applicationText, projectText), [applicationText, projectText]);
  const record = records[key] || { tasks:[], todos:[], updates:[] };

  const updateRecord = updater => {
    setRecords(prev => {
      const cur = prev[key] || { tasks:[], todos:[], updates:[] };
      const next = updater(cur);
      return { ...prev, [key]: { ...next, application: applicationText, project: projectText } };
    });
  };

  const baselineKey = useMemo(() => makeKey(baselineApplicationText, baselineProjectText), [baselineApplicationText, baselineProjectText]);
  const DEFAULT_BASELINE_RECORD = {
    readiness:{}, charter:{}, documentRows:[], changeRequestRows:[], stakeholderRows:[],
    benefitRows:[], dependencyRows:[], riskLogRows:[], lessonsLearnedRows:[]
  };
  const baselineRecord = baselineRecords[baselineKey] || DEFAULT_BASELINE_RECORD;
  const updateBaselineRecord = updater => {
    setBaselineRecords(prev => {
      const cur = prev[baselineKey] || DEFAULT_BASELINE_RECORD;
      const next = updater(cur);
      return { ...prev, [baselineKey]: { ...next, application: baselineApplicationText, project: baselineProjectText } };
    });
  };
  const onCommitBaseline = fields => updateBaselineRecord(cur => ({ ...cur, ...fields }));

  const cmKey = useMemo(() => makeKey(cmApplicationText, cmProjectText), [cmApplicationText, cmProjectText]);
  const changeManagementRecord = changeManagementRecords[cmKey] || { notes:"" };
  const onCommitNotes = value => setChangeManagementRecords(prev => ({
    ...prev, [cmKey]: { ...(prev[cmKey] || {}), notes: value, application: cmApplicationText, project: cmProjectText }
  }));

  const onOpenProjectWizard = (application, project) => {
    setApplicationText(application);
    setProjectText(project);
    setBaselineApplicationText(application);
    setBaselineProjectText(project);
    setCmApplicationText(application);
    setCmProjectText(project);
    setWizardStep(1);
    setActiveView("project-wizard");
  };

  // Tracks whether the currently active wizard step (Timeline/PMO/Change
  // Management) has unsaved edits, and how to commit them — set by
  // whichever step is mounted via onWizardDraftStateChange. Any navigation
  // away while dirty (wizard step change, exit, or clicking a sidebar
  // menu) is routed through guardedNavigate, which shows a modal offering
  // to save or discard before the navigation actually happens.
  const [wizardDirty, setWizardDirty] = useState(false);
  const wizardCommitRef = useRef(() => {});
  const [pendingNavigation, setPendingNavigation] = useState(null);
  const onWizardDraftStateChange = (isDirty, commitFn) => { setWizardDirty(isDirty); wizardCommitRef.current = commitFn; };
  const commitActiveWizardStep = () => wizardCommitRef.current();
  const guardedNavigate = action => {
    if (wizardDirty) { setPendingNavigation(() => action); return; }
    action();
  };
  const onSidebarNavigate = viewKey => guardedNavigate(() => setActiveView(viewKey));
  const onWizardStepChange = newStep => guardedNavigate(() => setWizardStep(newStep));
  const onExitWizard = () => guardedNavigate(() => setActiveView("list"));
  const onConfirmSaveAndContinue = () => {
    wizardCommitRef.current();
    setWizardDirty(false);
    wizardCommitRef.current = () => {};
    const action = pendingNavigation;
    setPendingNavigation(null);
    if (action) action();
  };
  const onConfirmDiscardAndContinue = () => {
    setWizardDirty(false);
    wizardCommitRef.current = () => {};
    const action = pendingNavigation;
    setPendingNavigation(null);
    if (action) action();
  };
  const onCancelNavigation = () => setPendingNavigation(null);

  const onSaveMasterData = draft => setMasterData({ ...DEFAULT_MASTER_DATA, ...draft });
  const onSaveUserManagement = draft => setUserManagement({ ...DEFAULT_USER_MANAGEMENT, ...draft });

  const onLogin = rawEmail => {
    const email = norm(rawEmail).toLowerCase();
    if (!email) return { ok:false, message:"Email is required." };
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return { ok:false, message:"Invalid email format." };

    const totalRegistered = USER_ROLES.reduce((sum, r) => sum + ((userManagement[r.key] || []).length), 0);
    let matchedRole = null;
    for (const role of USER_ROLES) {
      const list = userManagement[role.key] || [];
      if (list.some(e => norm(e).toLowerCase() === email)) { matchedRole = role.key; break; }
    }

    if (!matchedRole && totalRegistered === 0) {
      // Bootstrap: no one is registered yet, so the first person to log in becomes Super Admin.
      matchedRole = "superAdmin";
      setUserManagement(prev => ({ ...prev, superAdmin: [...(prev.superAdmin || []), norm(rawEmail)] }));
    }

    if (!matchedRole) {
      return { ok:false, message:"Email not registered. Contact Super Admin to be added in User Management." };
    }

    setCurrentUser({ email: norm(rawEmail), role: matchedRole });
    return { ok:true };
  };
  const onLogout = () => setCurrentUser(null);
  const onSaveWeeklyReports = newReports => setWeeklyReports(list => [...list, ...newReports]);

  useEffect(() => {
    if (!mounted.current) { mounted.current = true; return; }
    setSaveStatus("saving");
    const t = setTimeout(() => {
      const ok = saveState({
        currentUser,
        activeView, projectList, records, baselineRecords, masterData, userManagement, changeManagementRecords, sidebarCollapsed,
        weeklyReports,
        lastApplication: applicationText, lastProject: projectText,
        lastBaselineApplication: baselineApplicationText, lastBaselineProject: baselineProjectText,
        lastCmApplication: cmApplicationText, lastCmProject: cmProjectText,
        taskColumnOrder, taskHiddenColumns, todoHiddenColumns, plColumnOrder, plHiddenColumns, taskGanttHidden, plGanttHidden
      });
      setSaveStatus(ok ? "saved" : "error");
      if (supabaseClient && remoteHydrated.current) {
        pushRemoteState({ projectList, records, baselineRecords, changeManagementRecords, masterData, userManagement, weeklyReports });
      }
    }, 400);
    return () => clearTimeout(t);
  }, [currentUser, activeView, projectList, records, baselineRecords, masterData, userManagement, changeManagementRecords, weeklyReports, sidebarCollapsed, applicationText, projectText, baselineApplicationText, baselineProjectText, cmApplicationText, cmProjectText, taskColumnOrder, taskHiddenColumns, todoHiddenColumns, plColumnOrder, plHiddenColumns, taskGanttHidden, plGanttHidden]);

  /* ---- Project List CRUD (read-only; creation happens via the Create Project menu) ---- */
  const onRemoveProjectRow = id => setProjectList(list => list.filter(r => r.id !== id));
  const onUpdateProjectRow = (id, field, value) => setProjectList(list => list.map(r => r.id === id ? { ...r, [field]: value } : r));
  const onImportProjectRows = rows => setProjectList(list => [
    ...list, ...rows.map(r => ({ ...r, createdBy: currentUser ? currentUser.email : "" }))
  ]);
  const onCreateProjectFieldChange = (field, value) => setCreateProjectForm(f => ({ ...f, [field]: value }));
  const onSubmitCreateProject = () => {
    if (!norm(createProjectForm.application) || !norm(createProjectForm.project)) {
      alert("Application and Project are required.");
      return;
    }
    setProjectList(list => [...list, { id: uid(), ...createProjectForm, createdBy: currentUser ? currentUser.email : "" }]);
    setCreateProjectForm({ application:"", deliveryModel:"", project:"", resource:"", mountain:"", stream:"", subStream:"", startDate:"", endDate:"", tpo:"", deliveryLead:"", priority:"", phase:"" });
    setActiveView("list");
  };

  const onSaveProjectFields = (projectId, fields) => {
    if (!norm(fields.application) || !norm(fields.project)) {
      alert("Application and Project are required.");
      return;
    }
    setProjectList(list => list.map(r => r.id === projectId ? { ...r, ...fields } : r));
  };

  const onPlSort = k => setPlSortConfig(c => c.key !== k ? { key:k, dir:"asc" } : (c.dir === "asc" ? { key:k, dir:"desc" } : { key:null, dir:"asc" }));
  const sortedProjectList = useMemo(() => {
    if (!plSortConfig.key) return projectList;
    const sk = plSortConfig.key;
    return [...projectList].sort((a,b) => {
      const av = String(a[sk]||"").toLowerCase(), bv = String(b[sk]||"").toLowerCase();
      if (av < bv) return plSortConfig.dir === "asc" ? -1 : 1;
      if (av > bv) return plSortConfig.dir === "asc" ? 1 : -1;
      return 0;
    });
  }, [projectList, plSortConfig]);
  const onExportProjectList = () => {
    const header = ["No", ...PL_COLS.map(c => c.label)];
    const rows = sortedProjectList.map((r, i) => {
      const row = { No: i+1 };
      PL_COLS.forEach(c => { row[c.label] = r[c.key] || ""; });
      return row;
    });
    const ws = XLSX.utils.json_to_sheet(rows, { header });
    ws["!cols"] = header.map(hLabel => ({ wch: Math.max(10, Math.min(40, hLabel.length + 6)) }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Project List");
    XLSX.writeFile(wb, `Project_List_${new Date().toISOString().slice(0,10)}.xlsx`);
  };

  /* ---- Detail task/todo/update CRUD ---- */
  const visibleColumns = useMemo(
    () => taskColumnOrder.filter(k => !taskHiddenColumns.includes(k) && COL_BY_KEY[k]).map(k => COL_BY_KEY[k]),
    [taskColumnOrder, taskHiddenColumns]
  );
  const onSort = k => setSortConfig(c => c.key !== k ? { key:k, dir:"asc" } : (c.dir === "asc" ? { key:k, dir:"desc" } : { key:null, dir:"asc" }));

  const onCommitRecord = (tasks, todos) => updateRecord(cur => ({ ...cur, tasks, todos }));
  const onToggleTodoColumn = colKey => setTodoHiddenColumns(c => c.includes(colKey) ? c.filter(k => k !== colKey) : [...c, colKey]);

  const onSubmitUpdate = text => {
    const v = (text || "").trim();
    if (!v) return;
    updateRecord(cur => ({ ...cur, updates: [...(cur.updates || []), { id: uid(), text: v, date: new Date().toISOString(), createdBy: currentUser ? currentUser.email : "" }] }));
  };
  const onDeleteUpdate = entryId => updateRecord(cur => ({ ...cur, updates: (cur.updates || []).filter(e => e.id !== entryId) }));

  const onToggleColumnVisibility = colKey => setTaskHiddenColumns(c => c.includes(colKey) ? c.filter(k => k !== colKey) : [...c, colKey]);
  const onReorderColumn = (dragKey, dropKey) => {
    setTaskColumnOrder(order => {
      const arr = [...order];
      const from = arr.indexOf(dragKey), to = arr.indexOf(dropKey);
      if (from === -1 || to === -1) return order;
      arr.splice(from, 1); arr.splice(to, 0, dragKey);
      return arr;
    });
  };
  const onTogglePlColumnVisibility = colKey => setPlHiddenColumns(c => c.includes(colKey) ? c.filter(k => k !== colKey) : [...c, colKey]);
  const onReorderPlColumn = (dragKey, dropKey) => {
    setPlColumnOrder(order => {
      const arr = [...order];
      const from = arr.indexOf(dragKey), to = arr.indexOf(dropKey);
      if (from === -1 || to === -1) return order;
      arr.splice(from, 1); arr.splice(to, 0, dragKey);
      return arr;
    });
  };
  const onToggleTaskGantt = () => setTaskGanttHidden(v => !v);
  const onTogglePlGantt = () => setPlGanttHidden(v => !v);

  const pics = useMemo(() => {
    const set = new Set();
    Object.values(records).forEach(r => {
      (r.tasks||[]).forEach(t => t.pic && set.add(t.pic));
      (r.todos||[]).forEach(t => t.pic && set.add(t.pic));
    });
    projectList.forEach(r => { r.tpo && set.add(r.tpo); r.deliveryLead && set.add(r.deliveryLead); });
    return [...set].sort();
  }, [records, projectList]);

  const detailViewProps = {
    applicationText, projectText, onApplicationChange: setApplicationText, onProjectChange: setProjectText, projectList,
    record, onCommitRecord,
    visibleColumns, taskColumnOrder, taskHiddenColumns, onToggleColumnVisibility, onReorderColumn,
    sortConfig, onSort,
    todoHiddenColumns, onToggleTodoColumn,
    onSubmitUpdate, onDeleteUpdate, saveStatus, picListId, pics,
    ganttHidden: taskGanttHidden, onToggleGantt: onToggleTaskGantt, currentUser,
    onSaveProjectFields, phaseOptions: masterData.phase, mountainOptions: masterData.mountain, streamOptions: masterData.stream,
    subStreamOptions: masterData.subStream, applicationOptions: masterData.applications, deliveryModelOptions: masterData.deliveryModel
  };
  const baselineTimelineKey = useMemo(() => makeKey(baselineApplicationText, baselineProjectText), [baselineApplicationText, baselineProjectText]);
  const baselineTimelineRecord = records[baselineTimelineKey] || { tasks:[], todos:[] };
  const projectBaselineViewProps = {
    applicationText: baselineApplicationText, projectText: baselineProjectText,
    onApplicationChange: setBaselineApplicationText, onProjectChange: setBaselineProjectText,
    projectList, charter: baselineRecord.charter, readiness: baselineRecord.readiness,
    documentRows: baselineRecord.documentRows,
    changeRequestRows: baselineRecord.changeRequestRows, stakeholderRows: baselineRecord.stakeholderRows,
    benefitRows: baselineRecord.benefitRows, dependencyRows: baselineRecord.dependencyRows,
    riskLogRows: baselineRecord.riskLogRows, lessonsLearnedRows: baselineRecord.lessonsLearnedRows,
    timelineTasks: baselineTimelineRecord.tasks, timelineTodos: baselineTimelineRecord.todos,
    onCommitBaseline, currentUser
  };
  const changeManagementViewProps = {
    applicationText: cmApplicationText, projectText: cmProjectText,
    onApplicationChange: setCmApplicationText, onProjectChange: setCmProjectText,
    projectList, notes: changeManagementRecord.notes, onCommitNotes
  };

  if (remoteLoading) {
    return h("div", { style:{ minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", background:"#F3F5F8" } },
      h("div", { style:{ fontSize:13, color:"#64748B" } }, "Connecting to server\u2026")
    );
  }

  if (!currentUser) {
    return h(LoginView, { onLogin });
  }

  return h("div", { style:{ display:"flex", minHeight:"100vh", background:"#F3F5F8" } },
    h(UnsavedChangesModal, {
      open: pendingNavigation !== null, onSave: onConfirmSaveAndContinue, onDiscard: onConfirmDiscardAndContinue, onCancel: onCancelNavigation
    }),
    h(Sidebar, { active: activeView, onNavigate: onSidebarNavigate, collapsed: sidebarCollapsed, onToggleCollapse: onToggleSidebar, currentUser, onLogout }),
    h("div", { style:{ flex:1, minWidth:0 } },
      activeView === "dashboard-report"
        ? h(DashboardReportView, { projectList: sortedProjectList, records, currentUser, weeklyReports, onSaveWeeklyReports })
        : activeView === "weekly-report"
        ? h(WeeklyReportView, { weeklyReports })
        : activeView === "create-project"
        ? h(CreateProjectView, {
            form: createProjectForm, onFieldChange: onCreateProjectFieldChange, onSubmit: onSubmitCreateProject,
            phaseOptions: masterData.phase, mountainOptions: masterData.mountain, streamOptions: masterData.stream, subStreamOptions: masterData.subStream,
            applicationOptions: masterData.applications, deliveryModelOptions: masterData.deliveryModel
          })
        : activeView === "list"
        ? h(ProjectListView, {
            projectList: sortedProjectList, onUpdate: onUpdateProjectRow, onRemove: onRemoveProjectRow,
            sortConfig: plSortConfig, onSort: onPlSort, onImport: onImportProjectRows, onExport: onExportProjectList,
            phaseOptions: masterData.phase, mountainOptions: masterData.mountain, streamOptions: masterData.stream,
            subStreamOptions: masterData.subStream, applicationOptions: masterData.applications, deliveryModelOptions: masterData.deliveryModel,
            onOpenWizard: onOpenProjectWizard,
            columnOrder: plColumnOrder, hiddenColumns: plHiddenColumns,
            onToggleColumnVisibility: onTogglePlColumnVisibility, onReorderColumn: onReorderPlColumn,
            ganttHidden: plGanttHidden, onToggleGantt: onTogglePlGantt, currentUser
          })
        : activeView === "project-wizard"
        ? h(ProjectWizardView, {
            step: wizardStep, onStepChange: onWizardStepChange, onExit: onExitWizard,
            dirty: wizardDirty, onDraftStateChange: onWizardDraftStateChange, onSave: commitActiveWizardStep,
            application: applicationText, project: projectText,
            timelineProps: { ...detailViewProps, hideSelector: true, readOnly: false },
            pmoProps: { ...projectBaselineViewProps, hideSelector: true, readOnly: false },
            cmProps: { ...changeManagementViewProps, hideSelector: true, readOnly: false }
          })
        : activeView === "detail"
        ? h(DetailView, { ...detailViewProps, readOnly: true })
        : activeView === "master-data"
        ? h(MasterDataManagementView, {
            masterData, onSaveAll: onSaveMasterData,
            readOnly: !currentUser || currentUser.role !== "superAdmin"
          })
        : activeView === "user-management"
        ? h(UserManagementView, {
            userManagement, onSaveAll: onSaveUserManagement,
            readOnly: !currentUser || currentUser.role !== "superAdmin"
          })
        : PLACEHOLDER_TITLES[activeView]
        ? (activeView === "doc-baseline"
            ? h(ProjectBaselineView, { ...projectBaselineViewProps, readOnly: true })
            : activeView === "doc-stakeholder"
            ? h(ChangeManagementView, { ...changeManagementViewProps, readOnly: true })
            : h(DocumentPlaceholderView, { title: PLACEHOLDER_TITLES[activeView] }))
        : null
    )
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(h(AppRoot));
</script>
</body>
</html>
