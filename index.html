const STORAGE_KEY = "project-tracker-app-v3";

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}
function saveState(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); return true; }
  catch { return false; }
}

/* The fields that live in Supabase (shared/collaborative data). Everything else
   — column order, sidebar state, current selections, the login session, etc. —
   stays local to the device via localStorage, since it's per-user UI state. */
const SUPABASE_COLUMN_MAP = {
  projectList: "project_list",
  records: "records",
  baselineRecords: "baseline_records",
  changeManagementRecords: "change_management_records",
  masterData: "master_data",
  userManagement: "user_management",
  weeklyReports: "weekly_reports",
};

async function fetchRemoteState() {
  if (!supabaseClient) return null;
  const { data, error } = await supabaseClient.from(SUPABASE_TABLE).select("*").eq("id", SUPABASE_ROW_ID).maybeSingle();
  if (error || !data) return null;
  const out = {};
  Object.entries(SUPABASE_COLUMN_MAP).forEach(([stateKey, col]) => { if (data[col] !== undefined) out[stateKey] = data[col]; });
  return out;
}

async function pushRemoteState(partial) {
  if (!supabaseClient) return false;
  const row = { id: SUPABASE_ROW_ID, updated_at: new Date().toISOString() };
  Object.entries(SUPABASE_COLUMN_MAP).forEach(([stateKey, col]) => { if (partial[stateKey] !== undefined) row[col] = partial[stateKey]; });
  const { error } = await supabaseClient.from(SUPABASE_TABLE).upsert(row, { onConflict: "id" });
  return !error;
}

function subscribeRemoteState(onChange) {
  if (!supabaseClient) return () => {};
  const channel = supabaseClient
    .channel("app_state_changes")
    .on("postgres_changes", { event: "*", schema: "public", table: SUPABASE_TABLE, filter: `id=eq.${SUPABASE_ROW_ID}` }, payload => {
      if (!payload.new) return;
      const out = {};
      Object.entries(SUPABASE_COLUMN_MAP).forEach(([stateKey, col]) => { if (payload.new[col] !== undefined) out[stateKey] = payload.new[col]; });
      onChange(out);
    })
    .subscribe();
  return () => supabaseClient.removeChannel(channel);
}

const PALETTE = ["#1E3A5F","#2E6F95","#4F9D9D","#8FBF9F","#D9A441","#C1666B","#7C6A8E","#4A5568"];

/* ---------- timeline (weekly grid, dynamic range based on the data present) ---------- */
const WEEK_W = 18;
const MS_PER_DAY = 86400000;

function weekIndexFor(dateStr, epoch, totalWeeks) {
  if (!dateStr) return null;
  const t = new Date(dateStr + "T00:00:00Z").getTime();
  if (isNaN(t)) return null;
  const days = Math.floor((t - epoch) / MS_PER_DAY);
  const w = Math.floor(days / 7);
  return (w < 0 || w >= totalWeeks) ? null : w;
}

/* Computes the smallest week-aligned date range (padded to whole months,
   with a little breathing room) that covers every startDate/endDate found
   in `rows` — so the Gantt only spans the period that actually has data,
   instead of a fixed multi-year window. Falls back to the current month
   when no dates are present yet. */
function computeGanttRange(rows) {
  let minT = null, maxT = null;
  (rows || []).forEach(r => {
    [r.startDate, r.endDate].forEach(d => {
      if (!d) return;
      const t = new Date(d + "T00:00:00Z").getTime();
      if (isNaN(t)) return;
      if (minT === null || t < minT) minT = t;
      if (maxT === null || t > maxT) maxT = t;
    });
  });
  const now = new Date();
  if (minT === null) {
    minT = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), 1);
    maxT = minT;
  }
  const minD = new Date(minT), maxD = new Date(maxT);
  const epoch = Date.UTC(minD.getUTCFullYear(), minD.getUTCMonth(), 1);
  const rangeEndExclusive = Date.UTC(maxD.getUTCFullYear(), maxD.getUTCMonth() + 1, 1);
  const totalDays = Math.round((rangeEndExclusive - epoch) / MS_PER_DAY);
  const totalWeeks = Math.max(5, Math.ceil(totalDays / 7));
  return { epoch, totalWeeks, firstYear: minD.getUTCFullYear() };
}

/* One cell per week column, tagged with the calendar year it falls in
   (and whether it's the first week of a new year), so the grid can label
   each column by week number and shade/mark year transitions. */
function buildWeekCells(epoch, totalWeeks) {
  const out = [];
  let prevYear = null;
  for (let i = 0; i < totalWeeks; i++) {
    const year = new Date(epoch + i * 7 * MS_PER_DAY).getUTCFullYear();
    out.push({ index:i, x: i * WEEK_W, year, isYearStart: year !== prevYear });
    prevYear = year;
  }
  return out;
}
/* One tick per calendar month within the range, used to label the Gantt
   header — e.g. "Jan 2026", "Feb". */
function buildMonthTicks(epoch, totalWeeks) {
  const out = [];
  const start = new Date(epoch);
  let y = start.getUTCFullYear(), m = start.getUTCMonth();
  const endEpoch = epoch + totalWeeks * 7 * MS_PER_DAY;
  while (true) {
    const t = Date.UTC(y, m, 1);
    if (t >= endEpoch) break;
    const days = Math.floor((t - epoch) / MS_PER_DAY);
    const w = Math.floor(days / 7);
    if (w >= 0 && w < totalWeeks) {
      out.push({
        x: w * WEEK_W,
        label: new Date(t).toLocaleDateString("en-US", { month:"short", timeZone:"UTC" }) + (m === 0 ? ` ${y}` : ""),
        isYearStart: m === 0
      });
    }
    m++;
    if (m > 11) { m = 0; y++; }
  }
  return out;
}
/* Column tint by calendar year — 2027 is highlighted light blue; every
   other year stays neutral white/navy. */
function ganttYearRowColor(year) { return year === 2027 ? "#EAF1FB" : "#FFFFFF"; }
function ganttYearHeaderColor(year) { return year === 2027 ? "#1E3A5F" : "#152238"; }

function TimelineHeader({ weekCells, monthTicks }) {
  return h("div", { style: { position:"relative", height:32, overflow:"hidden" }, title:"Timeline" },
    weekCells.map(w => h("div", { key:`bg${w.index}`, style:{
      position:"absolute", left:w.x, top:0, bottom:0, width:WEEK_W, background: ganttYearHeaderColor(w.year)
    } })),
    weekCells.map(w => h("div", { key:`wk${w.index}`, style:{ position:"absolute", left:w.x, top:0, bottom:0, borderLeft: w.isYearStart ? "1px solid rgba(255,255,255,0.55)" : "1px solid rgba(255,255,255,0.1)" } })),
    monthTicks.map((t,i) => h("div", { key:i, style:{ position:"absolute", left:t.x, top:0, bottom:0, borderLeft: t.isYearStart ? "1px solid rgba(255,255,255,0.55)" : "1px solid rgba(255,255,255,0.28)" } },
      h("span", { style:{ position:"absolute", top:9, left:4, fontSize:11, color:t.isYearStart?"#fff":"#B7C3D6", fontWeight:t.isYearStart?700:400, whiteSpace:"nowrap" } }, t.label)
    ))
  );
}

function TimelineBar({ startDate, endDate, colorSeed, epoch, totalWeeks }) {
  const s = weekIndexFor(startDate, epoch, totalWeeks), e = weekIndexFor(endDate, epoch, totalWeeks);
  const ok = s !== null && e !== null;
  const lo = ok ? Math.min(s,e) : 0, hi = ok ? Math.max(s,e) : 0;
  const color = PALETTE[(colorSeed||0) % PALETTE.length];
  const timelineW = totalWeeks * WEEK_W;
  return h("div", { style:{ position:"relative", width:timelineW, height:38 } },
    ok && h("div",{ title:`${startDate} \u2013 ${endDate}`, style:{ position:"absolute", left:lo*WEEK_W+2, top:6, height:26, width:Math.max((hi-lo+1)*WEEK_W-4,10), background:color, borderRadius:5 } })
  );
}

const STATUS_OPTS = ["Open","In Progress","Done","Cancelled"];
const STATUS_BG = { Open:"#DCFCE7", "In Progress":"#FEF9C3", Done:"#E5E7EB", Cancelled:"#E5E7EB" };

/* Badge color palette used to render the Project List "Phase" dropdown,
   whose options come dynamically from Master Data Management. Colors cycle

const PHASE_BADGE_PALETTE = [
  { bg:"#E0E7FF", fg:"#3730A3" }, { bg:"#DBEAFE", fg:"#1D4ED8" }, { bg:"#CFFAFE", fg:"#0E7490" },
  { bg:"#DCFCE7", fg:"#166534" }, { bg:"#FEF9C3", fg:"#854D0E" }, { bg:"#FFEDD5", fg:"#C2410C" },
  { bg:"#FCE7F3", fg:"#9D174D" }, { bg:"#E5E7EB", fg:"#374151" }, { bg:"#D1FAE5", fg:"#065F46" },
  { bg:"#EDE9FE", fg:"#5B21B6" },
];
function buildPhaseColorMaps(phaseOptions) {
  const bg = {}, fg = {};
  (phaseOptions || []).forEach((label, i) => {
    const c = PHASE_BADGE_PALETTE[i % PHASE_BADGE_PALETTE.length];
    bg[label] = c.bg; fg[label] = c.fg;
  });

}

function RagSelect({ value, options, bgMap, fgMap, onChange, strikeValues }) {
  const bg = value ? (bgMap[value] || "#F1F5F9") : "#fff";
  const fg = value ? (fgMap[value] || "#475569") : "#1E293B";
  const strike = strikeValues && strikeValues.includes(value);
  return h("select", {
    value: value || "", onChange: e => onChange(e.target.value),
    style: { width:"100%", fontSize:12, fontWeight:600, border: value ? "1px solid transparent" : "1px solid #E2E8F0",
      borderRadius:7, padding:"6px 4px", background:bg, color:fg, outline:"none", textAlign:"center",
      textDecoration: strike ? "line-through" : "none" }
  }, h("option",{value:""},"\u2014 select \u2014"), options.map(o => h("option",{key:o,value:o},o)));
}

/* Excel-style column filter: a funnel button in the column header opens a
   checklist of that column's unique values. Uncheck a value to hide rows
   containing it. `selected` is either null (no filter / show all) or an
   array of the currently-checked values. Renders via position:fixed so the
   panel escapes any scrollable/overflow ancestor (table wrappers use
   overflow:auto and would otherwise clip it). */
function FilterDropdown({ options, selected, onChange }) {
  const [open, setOpen] = useState(false);
  const [search, setSearch] = useState("");
  const [pos, setPos] = useState({ top:0, left:0 });
  const btnRef = useRef(null);

  useEffect(() => {
    if (!open) return;
    const close = () => setOpen(false);
    document.addEventListener("click", close);
    window.addEventListener("scroll", close, true);
    window.addEventListener("resize", close);
    return () => {
      document.removeEventListener("click", close);
      window.removeEventListener("scroll", close, true);
      window.removeEventListener("resize", close);
    };
  }, [open]);

  const openPanel = () => {
    if (btnRef.current) {
      const r = btnRef.current.getBoundingClientRect();
      setPos({ top: r.bottom + 6, left: Math.max(8, Math.min(r.left - 90, window.innerWidth - 224)) });
    }
    setOpen(o => !o);
  };

  const checkedSet = selected === null ? new Set(options) : new Set(selected);
  const isActive = selected !== null && selected.length < options.length;
  const filteredOptions = options.filter(o => o.toLowerCase().includes(search.toLowerCase()));
  const toggleValue = v => {
    const next = new Set(checkedSet);
    if (next.has(v)) next.delete(v); else next.add(v);
    onChange(next.size === options.length ? null : [...next]);
  };

  return h("div", { style:{ position:"relative", display:"flex", flexShrink:0 }, onClick: e => e.stopPropagation() },
    h("button", {
      ref: btnRef, onClick: openPanel, title:"Filter",
      style:{ background:"none", border:"none", padding:0, display:"flex", alignItems:"center", cursor:"pointer",
        color: isActive ? "#5EEAD4" : "#B7C3D6" }
    }, h(Icon.filter,{})),
    open && h("div", {
      style:{ position:"fixed", top:pos.top, left:pos.left, zIndex:100, background:"#fff", color:"#1E293B",
        border:"1px solid #E2E8F0", borderRadius:10, boxShadow:"0 10px 25px rgba(0,0,0,0.18)", width:216,
        display:"flex", flexDirection:"column" },
      onClick: e => e.stopPropagation()
    },

/* Compute per-column unique display values (blank -> "(Empty)") for the
   FilterDropdown options, and a predicate to apply a filters map to a row. */
function buildColumnOptions(rows, colKeys) {
  const map = {};
  colKeys.forEach(key => {
    const vals = new Set();
    rows.forEach(r => { const v = norm(r[key]); vals.add(v ? v : "(Empty)"); });
    map[key] = [...vals].sort((a,b) => a.localeCompare(b));
  });
  return map;
}
function rowPassesFilters(row, filters, colKeys) {
  return colKeys.every(key => {
    const sel = filters[key];
    if (!sel) return true;
    const val = norm(row[key]) || "(Empty)";
    return sel.includes(val);
  });
}

/* Ownership rule: a record can only be edited/deleted by whoever created it,
   or by a Super Admin. Records made before this feature existed (no
   createdBy stamped) have no owner, so only Super Admin can touch those. */
function canModifyRecord(record, currentUser) {
  if (!currentUser) return false;
  if (currentUser.role === "superAdmin") return true;
  return !!(record && record.createdBy && record.createdBy === currentUser.email);
}
function OwnerLockNote({ record }) {
  const owner = record && record.createdBy;
  return h("span", { title: owner ? `Created by ${owner} \u2014 only the creator or Super Admin can edit/delete` : "Only Super Admin can edit/delete this data", style:{ color:"#CBD5E1", display:"flex" } }, h(Icon.lock,{}));
}

function ProjectListView({ projectList, onUpdate, onRemove, sortConfig, onSort, onImport, onExport, phaseOptions, mountainOptions, streamOptions, subStreamOptions, applicationOptions, deliveryModelOptions, onOpenWizard, columnOrder, hiddenColumns, onToggleColumnVisibility, onReorderColumn, ganttHidden, onToggleGantt, currentUser }) {
  const fileInputRef = useRef(null);
  const triggerImport = () => fileInputRef.current && fileInputRef.current.click();
  const handleImportFile = e => {
    if (!currentUser || currentUser.role !== "superAdmin") { e.target.value = ""; return; }
    const file = e.target.files[0];
    if (!file) { e.target.value = ""; return; }
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = new Uint8Array(ev.target.result);
        const wb = XLSX.read(data, { type:"array", cellDates:true });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { defval:"" });
        const pick = (row, ...keys) => {
          for (const k of keys) {
            if (row[k] !== undefined && row[k] !== "") return row[k];
            const found = Object.keys(row).find(rk => rk.trim().toLowerCase() === k.toLowerCase());
            if (found && row[found] !== "") return row[found];
          }
          return "";
        };
        const toISODate = v => {
          if (!v) return "";
          if (v instanceof Date) {
            const y = v.getFullYear(), m = String(v.getMonth()+1).padStart(2,"0"), d = String(v.getDate()).padStart(2,"0");
            return `${y}-${m}-${d}`;
          }
          const d2 = new Date(v);
          return isNaN(d2.getTime()) ? "" : d2.toISOString().slice(0,10);
        };
        const imported = rows.map(row => {
          const obj = { id: uid() };
          PL_COLS.forEach(c => {
            const compact = c.label.replace(/\s+/g, "");
            const raw = pick(row, c.label, compact);
            obj[c.key] = (c.key === "startDate" || c.key === "endDate") ? toISODate(raw) : String(raw || "");
          });
          obj.createdBy = currentUser ? currentUser.email : "";
          return obj;
        }).filter(r => r.application || r.project);

        if (imported.length === 0) {
          alert("No valid rows to import. Make sure the Application or Project column is filled in.");
          return;
        }

        // Reject the whole import if any row's Application + Project
        // combination is already in Project List, or repeats within the
        // file itself — no duplicate projects allowed either way.
        const comboKey = r => `${norm(r.application).toLowerCase()}\u2758${norm(r.project).toLowerCase()}`;
        const existingCombos = new Set((projectList || []).map(comboKey));
        const seenInFile = new Map();
        const dupErrors = [];
        imported.forEach((row, i) => {
          const combo = comboKey(row);
          if (!row.application && !row.project) return;
          if (existingCombos.has(combo)) {
            dupErrors.push(`Row ${i + 1}: Application "${row.application}" + Project "${row.project}" already exists in Project List`);
          } else if (seenInFile.has(combo)) {
            dupErrors.push(`Row ${i + 1}: duplicates row ${seenInFile.get(combo) + 1} in this file (Application "${row.application}" + Project "${row.project}")`);
          } else {
            seenInFile.set(combo, i);
          }
        });

        if (dupErrors.length > 0) {
          const shown = dupErrors.slice(0, 10).join("\n");
          const more = dupErrors.length > 10 ? `\n\u2026and ${dupErrors.length - 10} more issue(s).` : "";
          alert(`Import cancelled. Found ${dupErrors.length} duplicate Application + Project combination(s):\n\n${shown}${more}\n\nEach Application + Project combination must be unique.`);
          return;
        }

        // Every value in these columns must match an option already defined
        // in Master Data Management — reject the whole import otherwise.
        const MASTER_CHECKS = [
          { key:"application", label:"Application", options: applicationOptions },
          { key:"deliveryModel", label:"Delivery Model", options: deliveryModelOptions },
          { key:"mountain", label:"Mountain", options: mountainOptions },
          { key:"stream", label:"Stream", options: streamOptions },
          { key:"subStream", label:"Sub Stream", options: subStreamOptions },
          { key:"phase", label:"Phase", options: phaseOptions },
        ];
        const matches = (value, options) => (options || []).some(o => norm(o).toLowerCase() === norm(value).toLowerCase());
        const errors = [];
        imported.forEach((row, i) => {
          MASTER_CHECKS.forEach(chk => {
            const val = row[chk.key];
            if (val && !matches(val, chk.options)) {
              errors.push(`Row ${i + 1}: ${chk.label} "${val}" not found in Master Data Management`);
            }
          });
        });

        if (errors.length > 0) {
          const shown = errors.slice(0, 10).join("\n");
          const more = errors.length > 10 ? `\n\u2026and ${errors.length - 10} more issue(s).` : "";
          alert(`Import cancelled. Found ${errors.length} value(s) that dont match Master Data Management:\n\n${shown}${more}\n\nFix the data in the file, or add these values to Master Data Management first.`);
          return;
        }

        onImport(imported);
        alert(`${imported.length} project(s) imported successfully.`);
      } catch (err) {
        alert("Failed to read the file. Make sure the format matches the template (.xlsx).");
      }
    };
    reader.readAsArrayBuffer(file);
    e.target.value = "";
  };

  return h("div", { style:{ maxWidth:1500, margin:"0 auto", padding:"28px 28px 48px" } },
    h("div", { style:{ display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:10, marginBottom:20 } },
      h("div", null,
        h("h1", { style:{ fontSize:22, fontWeight:700, color:"#152238", margin:0 } }, "Project List"),
        h("p", { style:{ fontSize:13, color:"#64748B", margin:"4px 0 0" } }, "Master list of all projects and their weekly schedule. Click a Project name to fill in Timeline, PMO, and Change Management.")
      ),
      h("div", { style:{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap" } },
        currentUser && currentUser.role === "superAdmin" && h("button", { className:"btn", onClick:triggerImport }, h(Icon.upload,{}), "Import"),
        h("input", { ref:fileInputRef, type:"file", accept:".xlsx,.xls", onChange:handleImportFile, style:{ display:"none" } }),
        h("button", { className:"btn btn-outline", onClick:onExport }, h(Icon.download,{}), "Export"),
        h(ColumnManager, { columnOrder, hiddenColumns, onToggleVisibility: onToggleColumnVisibility, onReorder: onReorderColumn, colByKey: PL_COL_BY_KEY,
          extraToggle: { label:"Gantt Chart", checked: !ganttHidden, onToggle: onToggleGantt } })
      )
    ),
    h("div", { className:"card", style:{ padding:16 } },
      h(ProjectListTable, {
        rows: projectList, onUpdate, onRemove, sortConfig, onSort,
        phaseOptions, mountainOptions, streamOptions, subStreamOptions, applicationOptions, deliveryModelOptions, onOpenWizard,
        columns: columnOrder.filter(k => !hiddenColumns.includes(k) && PL_COL_BY_KEY[k]).map(k => PL_COL_BY_KEY[k]),
        showGantt: !ganttHidden, currentUser
      })
    )
  );
}

    case "pic": return h("input", { value: task.pic||"", onChange:e=>onUpdate("pic", e.target.value), list:picListId, placeholder:"PIC", style:textStyle });
    case "status": return h(RagSelect, { value: task.status, options: STATUS_OPTS, bgMap: STATUS_BG, fgMap: STATUS_FG, strikeValues:["Cancelled"], onChange: v => onUpdate("status", v) });
    case "priority": return h(RagSelect, { value: task.priority, options: PRIORITY_OPTS, bgMap: PRIORITY_BG, fgMap: PRIORITY_FG, onChange: v => onUpdate("priority", v) });
    case "phase": return h(RagSelect, { value: task.phase, options: PHASE_OPTS, bgMap: PHASE_BG, fgMap: PHASE_FG, onChange: v => onUpdate("phase", v) });
    case "notes": return h("input", { value: task.notes||"", onChange:e=>onUpdate("notes", e.target.value), placeholder:"Catatan\u2026", style:textStyle });

  }
}

/* Read-only rendering for a task row the current user isn't allowed to edit. */

  const textStyle = { fontSize:13, color:"#334155" };
  switch (colKey) {
    case "task": return h("span", { style:textStyle }, task.task || "\u2014");

    case "endDate": return h("span", { style:{ ...textStyle, fontSize:12 } }, task.endDate || "\u2014");
    case "pic": return h("span", { style:textStyle }, task.pic || "\u2014");
    case "status": return h(StaticBadge, { value: task.status, bgMap: STATUS_BG, fgMap: STATUS_FG });
    case "priority": return h(StaticBadge, { value: task.priority, bgMap: PRIORITY_BG, fgMap: PRIORITY_FG });
    case "phase": return h(StaticBadge, { value: task.phase, bgMap: PHASE_BG, fgMap: PHASE_FG });

function ColumnManager({ columnOrder, hiddenColumns, onToggleVisibility, onReorder, colByKey, extraToggle }) {

  }, [open]);
  const cols = columnOrder.map(k => lookup[k]).filter(Boolean);
  return h("div", { style:{ position:"relative" }, onClick: e => e.stopPropagation() },

  const [filters, setFilters] = useState({});
  const ganttRange = useMemo(() => computeGanttRange(tasks), [tasks]);

  const timelineW = ganttRange.totalWeeks * WEEK_W;
  const todayIdx = weekIndexFor(new Date().toISOString().slice(0,10), ganttRange.epoch, ganttRange.totalWeeks);

    ),
    h("div", { style:{ overflowX:"auto", border:"1px solid #E2E8F0", borderRadius:12 } },
      h("div", { style:{ minWidth: showGantt ? fixedW + timelineW : fixedW } },

          h("div", { style:{ display:"flex", position:"sticky", left:0, zIndex:7, background:"#152238" } },
            h("div", { style:{ width:44, padding:"10px 8px", color:"#fff", fontSize:12, fontWeight:600 } }, "No"),
            columns.map(c => h(SortableHeaderCell, { key:c.key, col:c, sortConfig, onSort,
              filterOptions: columnOptions[c.key] || [], filterSelected: filters[c.key] || null,
              onFilterChange: v => onFilterChange(c.key, v) })),
            h("div", { style:{ width:40 } })
          ),
          showGantt && h("div", { style:{ width:timelineW, background:"#152238" } }, h(TimelineHeader, { weekCells, monthTicks }))
        ),
        h("div", { style:{ position:"relative" } },

            weekCells.map(w => h("div", { key:`bg${w.index}`, style:{ position:"absolute", left:w.x, top:0, bottom:0, width:WEEK_W, background: ganttYearRowColor(w.year) } })),
            weekCells.map(w => h("div", { key:`wk${w.index}`, style:{ position:"absolute", left:w.x, top:0, bottom:0, borderLeft: w.isYearStart ? "2px solid #64748B" : "1px solid #F1F5F9" } })),
            todayIdx !== null && h("div",{style:{position:"absolute", left:todayIdx*WEEK_W, top:0, bottom:0, borderLeft:"2px solid #EF4444", zIndex:2}, title:"Today"})
          ),
          filteredTasks.length === 0
            ? h("div", { style:{ padding:"36px 0", textAlign:"center", color:"#94A3B8", fontSize:13, width: fixedW } }, "No tasks match the filter.")

              return h("div", { key:task.id, style:{ display:"flex", position:"relative", zIndex:1, borderBottom:"1px solid #F1F5F9", background:rowBg } },

                  h("div", { style:{ width:44, padding:"6px 8px", fontSize:13, color:"#64748B", display:"flex", alignItems:"center" } }, task.no),
                  columns.map(c => h("div", { key:c.key, style:{ width:c.width, padding:"6px 8px", display:"flex", alignItems:"center", minHeight:34 } },

                  )),

                )

        )
      )
    )
  );

function TodoTable({ todos, onUpdate, onRemove, hiddenColumns, picListId, currentUser }) {
  const [sortConfig, setSortConfig] = useState({ key:null, dir:"asc" });
  const [filters, setFilters] = useState({});
  const visibleCols = TODO_COLS.filter(c => c.key === "task" || !hiddenColumns.includes(c.key));
  const colKeys = useMemo(() => visibleCols.map(c => c.key), [visibleCols]);
  const tdStyle = { padding:"7px 10px", borderBottom:"1px solid #F1F5F9" };

  const onSort = k => setSortConfig(c => c.key !== k ? { key:k, dir:"asc" } : (c.dir === "asc" ? { key:k, dir:"desc" } : { key:null, dir:"asc" }));
  const onFilterChange = (k, v) => setFilters(f => ({ ...f, [k]: v }));
  const clearAllFilters = () => setFilters({});
  const columnOptions = useMemo(() => buildColumnOptions(todos, colKeys), [todos, colKeys]);
  const activeFilterCount = Object.values(filters).filter(v => Array.isArray(v)).length;

  const filtered = useMemo(() => todos.filter(t => rowPassesFilters(t, filters, colKeys)), [todos, filters, colKeys]);

  const sorted = useMemo(() => {
    if (!sortConfig.key) return filtered;
    const sk = sortConfig.key;
    return [...filtered].sort((a, b) => {
      const av = String(a[sk] || "").toLowerCase(), bv = String(b[sk] || "").toLowerCase();
      if (av < bv) return sortConfig.dir === "asc" ? -1 : 1;
      if (av > bv) return sortConfig.dir === "asc" ? 1 : -1;
      return 0;
    });
  }, [filtered, sortConfig]);

  return h("div", null,
    activeFilterCount > 0 && h("div", { style:{ display:"flex", alignItems:"center", gap:8, marginBottom:8, fontSize:12, color:"#64748B" } },
      h(Icon.filter,{ style:{ color:"#4F9D9D" } }),
      `${activeFilterCount} active filter(s) \u00B7 showing ${sorted.length} of ${todos.length} Tasks`,
      h("button", { onClick:clearAllFilters, style:{ color:"#1E3A5F", background:"none", border:"none", fontSize:12, fontWeight:600, textDecoration:"underline", padding:0, cursor:"pointer" } }, "Clear all filters")
    ),
    h("div", { style:{ border:"1px solid #E2E8F0", borderRadius:12, overflow:"auto" } },
      h("table", { style:{ width:"100%", borderCollapse:"collapse", fontSize:13 } },
        h("thead", null,
          h("tr", { style:{ background:"#152238" } },
            visibleCols.map(c => h(TodoHeaderCell, { key:c.key, col:c, sortConfig, onSort,
              filterOptions: columnOptions[c.key] || [], filterSelected: filters[c.key] || null,
              onFilterChange: v => onFilterChange(c.key, v) })),
            h("th", { style:{ width:40, background:"#152238" } })
          )
        ),
        h("tbody", null,
          todos.length === 0
            ? h("tr", null, h("td", { colSpan: visibleCols.length + 1, style:{ padding:"28px 8px", textAlign:"center", color:"#94A3B8", fontSize:13 } }, 'No Tasks yet. Click "Add Task".'))
          : sorted.length === 0
            ? h("tr", null, h("td", { colSpan: visibleCols.length + 1, style:{ padding:"28px 8px", textAlign:"center", color:"#94A3B8", fontSize:13 } }, 'No Tasks match the filter.'))
          : sorted.map((t, i) => h("tr", { key:t.id, style:{ background: i%2===0 ? "#fff" : "#FAFBFC" } },
              visibleCols.map(c => h("td", { key:c.key, style:tdStyle },
                !canModifyRecord(t, currentUser) ? h("span", { style:{ fontSize:13, color:"#334155" } },
                  c.key === "status" ? h(StaticBadge, { value:t.status, bgMap: STATUS_BG, fgMap: STATUS_FG }) :
                  c.key === "blocker" ? h(StaticBadge, { value:t.blocker, bgMap: TODO_BLOCKER_BG, fgMap: TODO_BLOCKER_FG }) :
                  (t[c.key] || "\u2014")
                ) :
                c.key === "task" ? h("input", { value:t.task||"", onChange:e=>onUpdate(t.id,"task",e.target.value), placeholder:"Nama task\u2026",
                    style:{ width:"100%", fontSize:13, border:"1px solid #E2E8F0", borderRadius:7, padding:"6px 8px", outline:"none" } }) :
                c.key === "pic" ? h("input", { value:t.pic||"", onChange:e=>onUpdate(t.id,"pic",e.target.value), list:picListId, placeholder:"PIC",
                    style:{ width:"100%", fontSize:13, border:"1px solid #E2E8F0", borderRadius:7, padding:"6px 8px", outline:"none" } }) :
                c.key === "dueDate" ? h("input", { type:"date", value:t.dueDate||"", onChange:e=>onUpdate(t.id,"dueDate",e.target.value),
                    style:{ width:"100%", fontSize:12, border:"1px solid #E2E8F0", borderRadius:7, padding:"6px 8px", outline:"none" } }) :
                c.key === "status" ? h(RagSelect, { value:t.status, options: TODO_STATUS_OPTS, bgMap: STATUS_BG, fgMap: STATUS_FG, strikeValues:["Cancelled"], onChange:v=>onUpdate(t.id,"status",v) }) :
                c.key === "blocker" ? h(RagSelect, { value:t.blocker, options: TODO_BLOCKER_OPTS, bgMap: TODO_BLOCKER_BG, fgMap: TODO_BLOCKER_FG, onChange:v=>onUpdate(t.id,"blocker",v) }) :
                null
              )),
              h("td", { style:{ ...tdStyle, textAlign:"center" } },
                canModifyRecord(t, currentUser)
                  ? h("button", { onClick:()=>onRemove(t.id), style:{ color:"#DC2626", background:"none", border:"none", fontSize:13, display:"flex" } }, h(Icon.trash,{}))
                  : h(OwnerLockNote, { record: t })
              )
            ))
        )
      )
    )
  );
}

function UpdateLog({ entries, onSubmit, onDelete }) {
  const [text, setText] = useState("");
  const submit = () => { const v = text.trim(); if (!v) return; onSubmit(v); setText(""); };
  const fmt = d => new Date(d).toLocaleString("en-US", { day:"2-digit", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" });
  const sorted = [...(entries||[])].sort((a,b) => new Date(b.date) - new Date(a.date));
  return h("div", null,
    h("div", { style:{ display:"flex", gap:10, marginBottom:16, alignItems:"flex-end" } },
      h("textarea", { value:text, onChange:e=>setText(e.target.value), placeholder:"Write a project update\u2026", rows:2,
        style:{ flex:1, fontSize:13, border:"1px solid #E2E8F0", borderRadius:9, padding:"9px 11px", outline:"none", resize:"vertical" } }),
      h("button", { className:"btn btn-primary", onClick:submit, style:{ padding:"10px 18px", flexShrink:0 } }, "Submit")
    ),
    sorted.length === 0
      ? h("div", { style:{ fontSize:13, color:"#94A3B8", padding:"18px 0", textAlign:"center" } }, "No updates submitted for this project yet.")
      : h("div", { style:{ display:"flex", flexDirection:"column", gap:11, maxHeight:320, overflow:"auto" } },
          sorted.map(entry => h("div", { key:entry.id, style:{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:8, borderLeft:"3px solid #4F9D9D", paddingLeft:11 } },
            h("div", { style:{ flex:1 } },
              h("div", { style:{ fontSize:12, color:"#94A3B8", marginBottom:2 } },
                fmt(entry.date), entry.createdBy ? ` \u00B7 ${entry.createdBy}` : ""
              ),
              h("div", { style:{ fontSize:13, color:"#334155", whiteSpace:"pre-wrap" } }, entry.text)
            ),
            h("button", { onClick:()=>onDelete(entry.id), title:"Delete update", style:{ color:"#DC2626", flexShrink:0, padding:2, background:"none", border:"none", fontSize:13, display:"flex" } }, h(Icon.trash,{}))
          ))
        )
  );
}

/* ---------- Application + Project dropdowns (sourced from Project List) ---------- */
function ProjectSelector({ application, project, onApplicationChange, onProjectChange, projectList }) {
  const applications = useMemo(() => [...new Set(projectList.map(r => norm(r.application)).filter(Boolean))].sort(), [projectList]);
  const projectsForApp = useMemo(() => {
    const scoped = application
      ? projectList.filter(r => norm(r.application).toLowerCase() === norm(application).toLowerCase())
      : projectList;
    return [...new Set(scoped.map(r => norm(r.project)).filter(Boolean))].sort();
  }, [projectList, application]);

  const selectStyle = { width:"100%", fontSize:13, borderRadius:8, padding:"9px 10px", border:"1px solid #E2E8F0", outline:"none", background:"#fff" };

  return h("div", { className:"card" },
    h("div", { style:{ display:"flex", gap:14, flexWrap:"wrap" } },
      h("div", { style:{ flex:"1 1 240px", minWidth:220 } },
        h("label", { style:{ fontSize:13, color:"#64748B", display:"block", marginBottom:7, fontWeight:500 } }, "Application"),
        applications.length === 0
          ? h("div", { style:{ fontSize:12, color:"#94A3B8", padding:"9px 10px", border:"1px dashed #E2E8F0", borderRadius:8 } }, "No Applications in Project List yet")
          : h("select", { value: application, onChange: e => { onApplicationChange(e.target.value); onProjectChange(""); }, style: selectStyle },
              h("option", { value:"" }, "\u2014 select Application \u2014"),
              applications.map(a => h("option", { key:a, value:a }, a))
            )
      ),
      h("div", { style:{ flex:"1 1 260px", minWidth:220 } },
        h("label", { style:{ fontSize:13, color:"#64748B", display:"block", marginBottom:7, fontWeight:500 } }, "Project"),
        projectsForApp.length === 0
          ? h("div", { style:{ fontSize:12, color:"#94A3B8", padding:"9px 10px", border:"1px dashed #E2E8F0", borderRadius:8 } }, "No Projects for this selection yet")
          : h("select", { value: project, onChange: e => onProjectChange(e.target.value), style: selectStyle },
              h("option", { value:"" }, "\u2014 select Project \u2014"),
              projectsForApp.map(p => h("option", { key:p, value:p }, p))
            )
      )
    )
  );
}

function DetailView({
  applicationText, projectText, onApplicationChange, onProjectChange, projectList,
  record, onCommitRecord,
  visibleColumns, taskColumnOrder, taskHiddenColumns, onToggleColumnVisibility, onReorderColumn,
  sortConfig, onSort,
  todoHiddenColumns, onToggleTodoColumn,
  onSubmitUpdate, onDeleteUpdate, saveStatus, picListId, pics, hideSelector, readOnly, ganttHidden, onToggleGantt, currentUser,
  onSaveProjectFields, phaseOptions, mountainOptions, streamOptions, subStreamOptions, applicationOptions, deliveryModelOptions,
  onDraftStateChange
}) {
  const fileInputRef = useRef(null);
  const triggerImport = () => fileInputRef.current && fileInputRef.current.click();
  const useDraft = !!hideSelector;

  const hasIdentity = norm(applicationText) && norm(projectText);
  const projectRow = useMemo(() => {
    if (!hasIdentity) return null;
    return (projectList || []).find(r =>
      norm(r.application).toLowerCase() === norm(applicationText).toLowerCase() &&
      norm(r.project).toLowerCase() === norm(projectText).toLowerCase()
    ) || null;
  }, [projectList, applicationText, projectText, hasIdentity]);
  const canAddToProject = !!(projectRow && canModifyRecord(projectRow, currentUser));

  // Draft copies — edited freely, never touch global state until the
  // wizard's single Save button (in ProjectWizardView) commits them.
  const [draftTasks, setDraftTasks] = useState(() => record.tasks || []);
  const [draftTodos, setDraftTodos] = useState(() => record.todos || []);
  const [draftProjectFields, setDraftProjectFields] = useState(() => extractProjectFields(projectRow));
  const [dirty, setDirty] = useState(false);
  const markDirty = () => setDirty(true);

  const draftAddTask = () => {
    if (!canAddToProject) return;
    setDraftTasks(list => {
      const maxNo = Math.max(0, ...list.map(t => parseInt(t.no) || 0));
      return [...list, { id: uid(), no:String(maxNo+1), task:"", startDate:"", endDate:"", pic:"", status:"", priority:"", phase:"", notes:"", createdBy: currentUser ? currentUser.email : "" }];
    });
    markDirty();
  };
  const draftUpdateTask = (taskId, field, value) => { setDraftTasks(list => list.map(t => t.id===taskId ? { ...t, [field]:value } : t)); markDirty(); };
  const draftRemoveTask = taskId => { setDraftTasks(list => list.filter(t => t.id!==taskId)); markDirty(); };
  const draftImportTasks = newTasks => {
    if (!canAddToProject) return;
    setDraftTasks(list => [...list, ...newTasks.map(t => ({ ...t, createdBy: currentUser ? currentUser.email : "" }))]);
    markDirty();
  };

  const draftAddTodo = () => {
    if (!canAddToProject) return;
    setDraftTodos(list => [...list, { id: uid(), task:"", pic:"", dueDate:"", status:"", blocker:"", createdBy: currentUser ? currentUser.email : "" }]);
    markDirty();
  };
  const draftUpdateTodo = (todoId, field, value) => { setDraftTodos(list => list.map(t => t.id===todoId ? { ...t, [field]:value } : t)); markDirty(); };
  const draftRemoveTodo = todoId => { setDraftTodos(list => list.filter(t => t.id!==todoId)); markDirty(); };

  const draftUpdateProjectField = (field, value) => { setDraftProjectFields(f => ({ ...f, [field]:value })); markDirty(); };

  const effectiveTasks = useDraft ? draftTasks : (record.tasks || []);
  const effectiveTodos = useDraft ? draftTodos : (record.todos || []);
  const effAddTask = useDraft ? draftAddTask : () => {};
  const effUpdateTask = useDraft ? draftUpdateTask : () => {};
  const effRemoveTask = useDraft ? draftRemoveTask : () => {};
  const effImportTasks = useDraft ? draftImportTasks : () => {};
  const effAddTodo = useDraft ? draftAddTodo : () => {};
  const effUpdateTodo = useDraft ? draftUpdateTodo : () => {};
  const effRemoveTodo = useDraft ? draftRemoveTodo : () => {};

  const commit = () => {
    onCommitRecord(draftTasks, draftTodos);
    if (projectRow) onSaveProjectFields(projectRow.id, draftProjectFields);
    setDirty(false);
  };
  useEffect(() => {
    if (useDraft && onDraftStateChange) onDraftStateChange(dirty, commit);
  }, [dirty, draftTasks, draftTodos, draftProjectFields]);

  const sortedTasks = useMemo(() => {
    if (!sortConfig.key) return effectiveTasks;
    const sk = sortConfig.key;
    return [...effectiveTasks].sort((a, b) => {
      const av = String(a[sk] || "").toLowerCase(), bv = String(b[sk] || "").toLowerCase();
      if (av < bv) return sortConfig.dir === "asc" ? -1 : 1;
      if (av > bv) return sortConfig.dir === "asc" ? 1 : -1;
      return 0;
    });
  }, [effectiveTasks, sortConfig]);

  // Overall Timeline progress: Done items (from both the task table and
  // the to-do table) over all items that aren't Cancelled.
  const timelineProgress = useMemo(() => computeTimelineProgress(effectiveTasks, effectiveTodos), [effectiveTasks, effectiveTodos]);

  const handleImportFile = e => {
    if (!canAddToProject) { e.target.value = ""; return; }
    const file = e.target.files[0];
    if (!file) { e.target.value = ""; return; }
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = new Uint8Array(ev.target.result);
        const wb = XLSX.read(data, { type:"array", cellDates:true });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { defval:"" });
        const pick = (row, ...keys) => {
          for (const k of keys) {
            if (row[k] !== undefined && row[k] !== "") return row[k];
            const found = Object.keys(row).find(rk => rk.trim().toLowerCase() === k.toLowerCase());
            if (found && row[found] !== "") return row[found];
          }
          return "";
        };
        const toISODate = v => {
          if (!v) return "";
          if (v instanceof Date) {
            const y = v.getFullYear(), m = String(v.getMonth()+1).padStart(2,"0"), d = String(v.getDate()).padStart(2,"0");
            return `${y}-${m}-${d}`;
          }
          const d2 = new Date(v);
          return isNaN(d2.getTime()) ? "" : d2.toISOString().slice(0,10);
        };
        const imported = rows.map((row, idx) => ({
          id: uid(),
          no: String(pick(row,"No") || idx+1),
          task: String(pick(row,"Task") || ""),
          startDate: toISODate(pick(row,"Start Date","StartDate")),
          endDate: toISODate(pick(row,"End Date","EndDate")),
          pic: String(pick(row,"PIC") || ""),
          status: String(pick(row,"Status") || ""),
          phase: String(pick(row,"Phase") || "")
        })).filter(t => t.task);
        if (imported.length === 0) alert("No valid rows to import. Make sure the Task column is filled in.");
        else { effImportTasks(imported); alert(`${imported.length} task(s) imported \u2014 click Save at the bottom of the page to keep them.`); }
      } catch (err) {
        alert("Failed to read the file. Make sure the format matches the template (.xlsx).");
      }
    };
    reader.readAsArrayBuffer(file);
    e.target.value = "";
  };

  const exportDetailProject = () => {
    const cols = visibleColumns.filter(c => c.key !== "action");
    const header = ["No", ...cols.map(c => c.label)];
    const rows = sortedTasks.map(t => {
      const row = { No: t.no };
      cols.forEach(c => { row[c.label] = t[c.key] || ""; });
      return row;
    });
    const ws = XLSX.utils.json_to_sheet(rows, { header });
    ws["!cols"] = header.map(hLabel => ({ wch: Math.max(10, Math.min(40, hLabel.length + 6)) }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Project Timeline");
    const infoWs = XLSX.utils.aoa_to_sheet([["Application", applicationText || "-"], ["Project", projectText || "-"]]);
    XLSX.utils.book_append_sheet(wb, infoWs, "Info");
    const safe = s => (s || "Untitled").replace(/[\\/:*?"<>|]/g, "_").slice(0, 40);
    const date = new Date().toISOString().slice(0,10);
    XLSX.writeFile(wb, `Project_Timeline_${safe(applicationText)}_${safe(projectText)}_${date}.xlsx`);
  };

  return h("div", { style:{ maxWidth:1500, margin:"0 auto", padding:"28px 28px 48px" } },
    h("div", { style:{ display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:8, marginBottom:20 } },
      h("div", null,
        h("h1", { style:{ fontSize:22, fontWeight:700, color:"#152238", margin:0 } }, "Timeline"),
        h("p", { style:{ fontSize:13, color:"#64748B", margin:"4px 0 0" } }, "Manage task details, to-dos, and weekly updates per project.")
      ),
      useDraft
        ? (dirty && h("div", { style:{ fontSize:12, color:"#C2410C", fontWeight:600 } }, "You have unsaved changes"))
        : h("div", { style:{ fontSize:12, color:"#94A3B8" } },
            saveStatus === "saving" ? "Saving\u2026" :
            saveStatus === "saved" ? "\u2713 Saved on this device" :
            saveStatus === "error" ? "Save failed" : "\u00A0"
          )
    ),

    !hideSelector && h(ProjectSelector, {
      application: applicationText, project: projectText,
      onApplicationChange, onProjectChange, projectList
    }),

    !hideSelector && !hasIdentity && h("div", { style:{ marginTop:16, fontSize:13, color:"#94A3B8", textAlign:"center", padding:"28px 0" } },
      "Select Application and Project above (data comes from the Project List menu) to start managing task details, to-dos, and updates."
    ),

    hasIdentity && h("div", { className:"card", style:{ marginTop:16 } },
      h("div", { style:{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:10, flexWrap:"wrap", gap:10 } },
        h("div", { style:{ fontSize:14, fontWeight:600, color:"#334155" } }, "Timeline Progress"),
        h("div", { style:{ fontSize:12, color:"#64748B" } }, `${timelineProgress.done} of ${timelineProgress.total} items done`),
        h("div", { style:{ fontSize:15, fontWeight:700, color: timelineProgress.pct === 100 ? "#166534" : "#1E3A5F" } }, `${timelineProgress.pct}%`)
      ),
      h("div", { style:{ height:8, borderRadius:6, background:"#E2E8F0", overflow:"hidden" } },
        h("div", { style:{ height:"100%", width:`${timelineProgress.pct}%`, background: timelineProgress.pct === 100 ? "#22C55E" : "#4F9D9D", borderRadius:6, transition:"width .3s ease" } })
      )
    ),

    hasIdentity && readOnly && h(ReadOnlyBanner),

    hasIdentity && h("div", { style: readOnly ? { pointerEvents:"none", opacity:0.7 } : {} },
    h("div", { className:"card", style:{ marginTop:16 } },
      h("div", { style:{ display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:8, marginBottom:14 } },
        h("div", { style:{ fontSize:14, fontWeight:600, color:"#334155" } }, "Project Timeline"),
        h("div", { style:{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap" } },
          canAddToProject && h("button", { className:"btn btn-outline", onClick:triggerImport },
            h(Icon.upload,{}), "Import"),
          h("input", { ref:fileInputRef, type:"file", accept:".xlsx,.xls", onChange:handleImportFile, style:{ display:"none" } }),
          h("button", { className:"btn btn-outline", onClick:exportDetailProject },
            h(Icon.download,{}), "Export Project Timeline"),
          h(ColumnManager, { columnOrder:taskColumnOrder, hiddenColumns:taskHiddenColumns, onToggleVisibility:onToggleColumnVisibility, onReorder:onReorderColumn,
            extraToggle: { label:"Gantt Chart", checked: !ganttHidden, onToggle: onToggleGantt } }),
          canAddToProject && h("button", { className:"btn btn-primary", onClick:effAddTask },
            h(Icon.plus,{}), "Add Task")
        )
      ),
      h("datalist", { id:picListId }, pics.map(p => h("option", { key:p, value:p }))),
      sortedTasks.length === 0
        ? h("div", { style:{ fontSize:13, color:"#94A3B8", padding:"36px 0", textAlign:"center" } },
            canAddToProject ? 'No tasks yet. Click "Add Task" or import from an Excel file.' : "No tasks yet.")
        : h(TaskTable, { tasks: sortedTasks, onUpdateTask: effUpdateTask, onRemoveTask: effRemoveTask, columns: visibleColumns, sortConfig, onSort, picListId, showGantt: !ganttHidden, currentUser })
    ),

    h("div", { className:"card", style:{ marginTop:16 } },
      h("div", { style:{ display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:8, marginBottom:14 } },
        h("div", { style:{ fontSize:14, fontWeight:600, color:"#334155", display:"flex", alignItems:"center", gap:7 } },
          h(Icon.checklist,{style:{color:"#4F9D9D"}}), "Tasks"),
        h("div", { style:{ display:"flex", alignItems:"center", gap:8 } },
          h(TodoColumnManager, { hiddenColumns: todoHiddenColumns, onToggleVisibility: onToggleTodoColumn }),
          canAddToProject && h("button", { className:"btn btn-primary", onClick:effAddTodo },
            h(Icon.plus,{}), "Add Task")
        )
      ),
      h(TodoTable, { todos: effectiveTodos, onUpdate: effUpdateTodo, onRemove: effRemoveTodo, hiddenColumns: todoHiddenColumns, picListId, currentUser })
    ),

    h("div", { className:"card", style:{ marginTop:16 } },
      h("div", { style:{ fontSize:14, fontWeight:600, color:"#334155", marginBottom:14 } }, "Notes"),
      h(UpdateLog, { entries: record.updates || [], onSubmit: onSubmitUpdate, onDelete: onDeleteUpdate })
    ),

    projectRow && h(ProjectDetailsCard, {
      projectRow, form: useDraft ? draftProjectFields : extractProjectFields(projectRow),
      onFieldChange: useDraft ? draftUpdateProjectField : () => {},
      editable: useDraft && canModifyRecord(projectRow, currentUser), currentUser,
      phaseOptions, mountainOptions, streamOptions, subStreamOptions, applicationOptions, deliveryModelOptions
    })
    )
  );
}

/* Shared Timeline progress calculation — Done items over all items that
   aren't Cancelled, across both the task table and the to-do table. Used
   on the Timeline page itself and to auto-derive the "Timeline" item on
   the PMO Launch Readiness Checklist. */
function computeTimelineProgress(tasks, todos) {
  const items = [...(tasks || []), ...(todos || [])];
  const counted = items.filter(t => norm(t.status).toLowerCase() !== "cancelled");
  const done = counted.filter(t => norm(t.status).toLowerCase() === "done").length;
  const total = counted.length;
  return { done, total, pct: total ? Math.round((done / total) * 100) : 0 };
}
/* All fields on the Project Charter form — including the title/TPO bar —
   used to auto-derive the "Project Charter" item on the Launch Readiness
   Checklist: true only once every one of these has something in it. */
const ALL_CHARTER_FIELD_KEYS = ["projectTitle", "tpo", ...Object.keys(CHARTER_FIELDS)];
function isCharterComplete(charter) {
  return ALL_CHARTER_FIELD_KEYS.every(k => norm(charter && charter[k]).length > 0);
}
/* "Document" on the checklist reflects the Documents table: true once at
   least one row exists and every row has Document Type, Description, and
   Link all filled in. */
function isDocumentSectionComplete(documentRows) {
  const rows = documentRows || [];
  if (rows.length === 0) return false;
  return rows.every(r => norm(r.docType).length > 0 && norm(r.description).length > 0 && norm(r.link).length > 0);
}

   Log, Risk Log, and Lessons Learned don't have real fields yet (still
   placeholder sections) — until they do, there's nothing to check, so
   they stay incomplete. */

}

/* Draft state + add/update/remove for one PMO log table. Always call this
   the same number of times, in the same order, in the parent component —
   it's a normal React hook underneath. */
function useLogRowsDraft(initialRows, canAdd, currentUser, markDirty) {
  const [rows, setRows] = useState(() => initialRows || []);
  const add = () => {
    if (!canAdd) return;
    setRows(list => [...list, { id: uid(), createdBy: currentUser ? currentUser.email : "" }]);
    markDirty();
  };
  const update = (rowId, field, value) => {
    setRows(list => list.map(r => r.id === rowId ? { ...r, [field]: value } : r));
    markDirty();
  };
  const remove = rowId => { setRows(list => list.filter(r => r.id !== rowId)); markDirty(); };
  return [rows, add, update, remove];
}

function ProjectBaselineView({
  applicationText, projectText, onApplicationChange, onProjectChange, projectList,
  charter, readiness, documentRows, changeRequestRows, stakeholderRows, benefitRows, dependencyRows, riskLogRows, lessonsLearnedRows,
  timelineTasks, timelineTodos,
  onCommitBaseline, hideSelector, readOnly, currentUser, onDraftStateChange
}) {
  const [expandedSections, setExpandedSections] = useState({ readiness:false, charter:false, benefit:false, stakeholder:false, risk:false, upload:false });
  const toggleSection = key => setExpandedSections(s => ({ ...s, [key]: !s[key] }));
  const hasIdentity = norm(applicationText) && norm(projectText);
  const useDraft = !!hideSelector;
  const hasIdentity2 = norm(applicationText) && norm(projectText);
  const projectRow = useMemo(() => {
    if (!hasIdentity2) return null;
    return (projectList || []).find(r =>
      norm(r.application).toLowerCase() === norm(applicationText).toLowerCase() &&
      norm(r.project).toLowerCase() === norm(projectText).toLowerCase()
    ) || null;
  }, [projectList, applicationText, projectText, hasIdentity2]);
  const canAddToProject = !!(projectRow && canModifyRecord(projectRow, currentUser));

  const [draftCharter, setDraftCharter] = useState(() => charter || {});
  const [draftDocumentRows, setDraftDocumentRows] = useState(() => documentRows || []);
  const [dirty, setDirty] = useState(false);
  const markDirty = () => setDirty(true);

  const draftUpdateCharterField = (field, value) => { setDraftCharter(c => ({ ...c, [field]:value })); markDirty(); };
  const draftAddDocumentRow = () => {
    if (!canAddToProject) return;
    setDraftDocumentRows(rows => [...rows, { id: uid(), docType:"", description:"", link:"", createdBy: currentUser ? currentUser.email : "" }]);
    markDirty();
  };
  const draftUpdateDocumentRow = (rowId, field, value) => {
    setDraftDocumentRows(rows => rows.map(r => r.id===rowId ? { ...r, [field]:value } : r));
    markDirty();
  };
  const draftRemoveDocumentRow = rowId => { setDraftDocumentRows(rows => rows.filter(r => r.id!==rowId)); markDirty(); };

  const [draftChangeRequestRows, addChangeRequestRow, updateChangeRequestRow, removeChangeRequestRow] = useLogRowsDraft(changeRequestRows, canAddToProject, currentUser, markDirty);
  const [draftStakeholderRows, addStakeholderRow, updateStakeholderRow, removeStakeholderRow] = useLogRowsDraft(stakeholderRows, canAddToProject, currentUser, markDirty);
  const [draftBenefitRows, addBenefitRow, updateBenefitRow, removeBenefitRow] = useLogRowsDraft(benefitRows, canAddToProject, currentUser, markDirty);
  const [draftDependencyRows, addDependencyRow, updateDependencyRow, removeDependencyRow] = useLogRowsDraft(dependencyRows, canAddToProject, currentUser, markDirty);
  const [draftRiskLogRows, addRiskLogRow, updateRiskLogRow, removeRiskLogRow] = useLogRowsDraft(riskLogRows, canAddToProject, currentUser, markDirty);
  const [draftLessonsLearnedRows, addLessonsLearnedRow, updateLessonsLearnedRow, removeLessonsLearnedRow] = useLogRowsDraft(lessonsLearnedRows, canAddToProject, currentUser, markDirty);

  const effCharter = useDraft ? draftCharter : (charter || {});
  const effDocumentRows = useDraft ? draftDocumentRows : (documentRows || []);
  const effChangeRequestRows = useDraft ? draftChangeRequestRows : (changeRequestRows || []);
  const effStakeholderRows = useDraft ? draftStakeholderRows : (stakeholderRows || []);
  const effBenefitRows = useDraft ? draftBenefitRows : (benefitRows || []);
  const effDependencyRows = useDraft ? draftDependencyRows : (dependencyRows || []);
  const effRiskLogRows = useDraft ? draftRiskLogRows : (riskLogRows || []);
  const effLessonsLearnedRows = useDraft ? draftLessonsLearnedRows : (lessonsLearnedRows || []);

  // Every row's non-id, non-createdBy fields must all be filled for that
  // row to count — and the section needs at least one row.
  const isRowsSectionComplete = (rows, columnKeys) => {
    if (!rows || rows.length === 0) return false;
    return rows.every(r => columnKeys.every(k => norm(r[k]).length > 0));
  };

  // The whole checklist is derived, not stored — every item reflects the
  // real state of its section, so it can never go stale or be faked.
  const isTimelineComplete = computeTimelineProgress(timelineTasks, timelineTodos).pct === 100;
  const effReadiness = useMemo(() => ({
    timeline: isTimelineComplete,
    charter: isCharterComplete(effCharter),
    changeRequest: isRowsSectionComplete(effChangeRequestRows, CR_LOG_COLUMNS.map(c => c.key)),
    stakeholder: isRowsSectionComplete(effStakeholderRows, STAKEHOLDER_COLUMNS.map(c => c.key)),
    benefit: isRowsSectionComplete(effBenefitRows, BENEFIT_COLUMNS.map(c => c.key)),
    dependency: isRowsSectionComplete(effDependencyRows, DEPENDENCY_COLUMNS.map(c => c.key)),
    riskLog: isRowsSectionComplete(effRiskLogRows, RISK_LOG_COLUMNS.map(c => c.key)),
    lessonsLearned: isRowsSectionComplete(effLessonsLearnedRows, LESSON_LEARNED_COLUMNS.map(c => c.key)),
    document: isDocumentSectionComplete(effDocumentRows)
  }), [isTimelineComplete, effCharter, effDocumentRows, effChangeRequestRows, effStakeholderRows, effBenefitRows, effDependencyRows, effRiskLogRows, effLessonsLearnedRows]);
  const effUpdateCharterField = useDraft ? draftUpdateCharterField : () => {};
  const effToggleReadinessItem = () => {};
  const effAddDocumentRow = useDraft ? draftAddDocumentRow : () => {};
  const effUpdateDocumentRow = useDraft ? draftUpdateDocumentRow : () => {};
  const effRemoveDocumentRow = useDraft ? draftRemoveDocumentRow : () => {};

  const commit = () => {
    onCommitBaseline({
      charter: draftCharter,
      readiness: {
        timeline: isTimelineComplete,
        charter: isCharterComplete(draftCharter),
        changeRequest: isRowsSectionComplete(draftChangeRequestRows, CR_LOG_COLUMNS.map(c => c.key)),
        stakeholder: isRowsSectionComplete(draftStakeholderRows, STAKEHOLDER_COLUMNS.map(c => c.key)),
        benefit: isRowsSectionComplete(draftBenefitRows, BENEFIT_COLUMNS.map(c => c.key)),
        dependency: isRowsSectionComplete(draftDependencyRows, DEPENDENCY_COLUMNS.map(c => c.key)),
        riskLog: isRowsSectionComplete(draftRiskLogRows, RISK_LOG_COLUMNS.map(c => c.key)),
        lessonsLearned: isRowsSectionComplete(draftLessonsLearnedRows, LESSON_LEARNED_COLUMNS.map(c => c.key)),
        document: isDocumentSectionComplete(draftDocumentRows)
      },
      documentRows: draftDocumentRows,
      changeRequestRows: draftChangeRequestRows, stakeholderRows: draftStakeholderRows, benefitRows: draftBenefitRows,
      dependencyRows: draftDependencyRows, riskLogRows: draftRiskLogRows, lessonsLearnedRows: draftLessonsLearnedRows
    });
    setDirty(false);
  };
  useEffect(() => {
    if (useDraft && onDraftStateChange) onDraftStateChange(dirty, commit);
  }, [dirty, draftCharter, draftDocumentRows, draftChangeRequestRows, draftStakeholderRows, draftBenefitRows, draftDependencyRows, draftRiskLogRows, draftLessonsLearnedRows]);

  return h("div", { style:{ maxWidth:1500, margin:"0 auto", padding:"28px 28px 48px" } },
    h("div", { style:{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", flexWrap:"wrap", gap:12, marginBottom:20 } },
      h("div", null,
        h("h1", { style:{ fontSize:22, fontWeight:700, color:"#152238", margin:0 } }, "PMO"),
        h("p", { style:{ fontSize:13, color:"#64748B", margin:"4px 0 0" } }, "Baseline documents per project: Launch Readiness Checklist, Project Charter, Change Request Log, Stakeholder Register, Benefit Register, Dependency Log, Risk Log, Lesson Learned, and Documents.")
      ),
      useDraft && dirty && h("div", { style:{ fontSize:12, color:"#C2410C", fontWeight:600 } }, "You have unsaved changes")
    ),

    !hideSelector && h(ProjectSelector, { application: applicationText, project: projectText, onApplicationChange, onProjectChange, projectList }),

    !hideSelector && !hasIdentity && h("div", { style:{ marginTop:16, fontSize:13, color:"#94A3B8", textAlign:"center", padding:"28px 0" } },
      "Select Application and Project above (data comes from the Project List menu) to manage the Project Baseline."
    ),

    hasIdentity && readOnly && h(ReadOnlyBanner),

    hasIdentity && h("div", { style: readOnly ? { pointerEvents:"none", opacity:0.7 } : {} },
    BASELINE_SECTIONS.map(section => {
      const expanded = !!expandedSections[section.key];
      if (section.key === "readiness") {
        return h("div", { key:section.key, className:"card", style:{ marginTop:16 } },
          h("div", { style:{ fontSize:14, fontWeight:600, color:"#334155", marginBottom:14 } }, section.label),
          h(LaunchReadinessChecklist, { readiness: effReadiness, onToggleItem: effToggleReadinessItem })
        );
      }
      if (section.key === "charter") {
        return h("div", { key:section.key, className:"card", style:{ marginTop:16 } },
          h("div", {
            onClick: () => toggleSection(section.key),
            style: { display:"flex", alignItems:"center", justifyContent:"space-between", cursor:"pointer" }
          },
            h("div", { style:{ fontSize:14, fontWeight:600, color:"#334155" } }, section.label),
            h(expanded ? Icon.down : Icon.chevronRight, { style:{ color:"#64748B", flexShrink:0 } })
          ),
          expanded && h(ProjectCharterForm, { charter: effCharter, onUpdateField: effUpdateCharterField })
        );
      }
      if (section.key === "upload") {
        return h("div", { key:section.key, className:"card", style:{ marginTop:16 } },
          h("div", {
            onClick: () => toggleSection(section.key),
            style: { display:"flex", alignItems:"center", justifyContent:"space-between", cursor:"pointer" }
          },
            h("div", { style:{ fontSize:14, fontWeight:600, color:"#334155" } }, section.label),
            h(expanded ? Icon.down : Icon.chevronRight, { style:{ color:"#64748B", flexShrink:0 } })
          ),
          expanded && h(DocumentsSection, {
            rows: effDocumentRows, onAdd: effAddDocumentRow, onUpdate: effUpdateDocumentRow, onRemove: effRemoveDocumentRow, currentUser, canAdd: canAddToProject
          })
        );
      }
      const LOG_TABLE_MAP = {
        changeRequest: { columns: CR_LOG_COLUMNS, rows: effChangeRequestRows, onAdd: useDraft ? addChangeRequestRow : () => {}, onUpdate: useDraft ? updateChangeRequestRow : () => {}, onRemove: useDraft ? removeChangeRequestRow : () => {}, showRowNumber: false },
        stakeholder: { columns: STAKEHOLDER_COLUMNS, rows: effStakeholderRows, onAdd: useDraft ? addStakeholderRow : () => {}, onUpdate: useDraft ? updateStakeholderRow : () => {}, onRemove: useDraft ? removeStakeholderRow : () => {} },
        benefit: { columns: BENEFIT_COLUMNS, rows: effBenefitRows, onAdd: useDraft ? addBenefitRow : () => {}, onUpdate: useDraft ? updateBenefitRow : () => {}, onRemove: useDraft ? removeBenefitRow : () => {} },
        dependency: { columns: DEPENDENCY_COLUMNS, rows: effDependencyRows, onAdd: useDraft ? addDependencyRow : () => {}, onUpdate: useDraft ? updateDependencyRow : () => {}, onRemove: useDraft ? removeDependencyRow : () => {} },
        riskLog: { columns: RISK_LOG_COLUMNS, rows: effRiskLogRows, onAdd: useDraft ? addRiskLogRow : () => {}, onUpdate: useDraft ? updateRiskLogRow : () => {}, onRemove: useDraft ? removeRiskLogRow : () => {} },
        lessonsLearned: { columns: LESSON_LEARNED_COLUMNS, rows: effLessonsLearnedRows, onAdd: useDraft ? addLessonsLearnedRow : () => {}, onUpdate: useDraft ? updateLessonsLearnedRow : () => {}, onRemove: useDraft ? removeLessonsLearnedRow : () => {} },
      };
      const table = LOG_TABLE_MAP[section.key];
      if (table) {
        return h("div", { key:section.key, className:"card", style:{ marginTop:16 } },
          h("div", {
            onClick: () => toggleSection(section.key),
            style: { display:"flex", alignItems:"center", justifyContent:"space-between", cursor:"pointer" }
          },
            h("div", { style:{ fontSize:14, fontWeight:600, color:"#334155" } }, section.label),
            h(expanded ? Icon.down : Icon.chevronRight, { style:{ color:"#64748B", flexShrink:0 } })
          ),
          expanded && h(EditableLogTable, {
            columns: table.columns, rows: table.rows, onAdd: table.onAdd, onUpdate: table.onUpdate, onRemove: table.onRemove,
            currentUser, canAdd: canAddToProject, showRowNumber: table.showRowNumber !== false
          })
        );
      }
      return h(BaselineSection, { key:section.key, section, expanded, onToggle: toggleSection });
    })
    )
  );
}

/* A project counts as "completed" once its Phase is 6 (Hypercare), 60
   (Closing), 61 (Cancelled), or 62 (Hold) — matched by the leading number
   in the Phase value (e.g. "60 - Closing" -> "60"). */
const COMPLETED_PHASE_CODES = ["6", "60", "61", "62"];
function isCompletedPhase(phaseValue) {
  const m = norm(phaseValue).match(/^(\d+)/);
  return !!(m && COMPLETED_PHASE_CODES.includes(m[1]));
}

/* =========================================================================
   WEEKLY REPORT — snapshot diffing + AI analysis
   ========================================================================= */
const SNAPSHOT_FIELDS = ["project", "application", "phase", "priority", "startDate", "endDate", "tpo", "deliveryLead", "resource"];

/* A lightweight per-project fingerprint used to detect changes between two
   report generations — not a full field-by-field audit, just enough to
   say "this project changed" and roughly what moved. */
function buildProjectSnapshot(row, records) {
  const key = makeKey(row.application, row.project);
  const rec = records[key] || {};
  const tasks = rec.tasks || [], todos = rec.todos || [];
  const snap = { id: row.id };
  SNAPSHOT_FIELDS.forEach(f => { snap[f] = row[f] || ""; });
  snap.taskCount = tasks.length;
  snap.todoCount = todos.length;
  snap.doneTaskCount = tasks.filter(t => norm(t.status).toLowerCase() === "done").length;
  snap.doneTodoCount = todos.filter(t => norm(t.status).toLowerCase() === "done").length;
  return snap;
}

function describeSnapshotChanges(prev, curr) {
  const changes = [];
  SNAPSHOT_FIELDS.forEach(f => { if (String(prev[f] || "") !== String(curr[f] || "")) changes.push(`${f}: "${prev[f] || "-"}" \u2192 "${curr[f] || "-"}"`); });
  if (prev.taskCount !== curr.taskCount) changes.push(`task count: ${prev.taskCount} \u2192 ${curr.taskCount}`);
  if (prev.todoCount !== curr.todoCount) changes.push(`to-do count: ${prev.todoCount} \u2192 ${curr.todoCount}`);
  if (prev.doneTaskCount !== curr.doneTaskCount) changes.push(`tasks done: ${prev.doneTaskCount} \u2192 ${curr.doneTaskCount}`);
  if (prev.doneTodoCount !== curr.doneTodoCount) changes.push(`to-dos done: ${prev.doneTodoCount} \u2192 ${curr.doneTodoCount}`);
  return changes;
}

/* Compares this generation's snapshots for a stream against the last
   saved snapshot for that same stream (from the previous weekly report,
   if any) and returns what was added, updated, and deleted. */
function diffStreamSnapshots(prevSnapshots, currSnapshots) {
  const prevById = new Map((prevSnapshots || []).map(s => [s.id, s]));
  const currById = new Map(currSnapshots.map(s => [s.id, s]));
  const added = currSnapshots.filter(s => !prevById.has(s.id));
  const deleted = (prevSnapshots || []).filter(s => !currById.has(s.id));
  const updated = currSnapshots
    .filter(s => prevById.has(s.id) && JSON.stringify(prevById.get(s.id)) !== JSON.stringify(s))
    .map(s => ({ snapshot: s, changes: describeSnapshotChanges(prevById.get(s.id), s) }));
  return { added, deleted, updated };
}

/* Asks Claude (via the Anthropic API, no key needed — handled by the
   platform) to turn a stream's raw diff + current risk data into a short
   narrative: what changed, and what needs unlocking/escalation vs. what's
   worth highlighting as a win or notable shift. */
async function generateStreamAiAnalysis(streamName, diff, riskContext) {
  const fallback = {
    summary: `${diff.added.length} project(s) added, ${diff.updated.length} updated, ${diff.deleted.length} removed since the last report.`,
    needsAttention: riskContext.delayedProjectNames.length ? riskContext.delayedProjectNames.map(n => `${n} is overdue and not yet closed.`) : [],
    highlights: []
  };
  try {
    const promptLines = [
      `Stream: ${streamName}`,
      `Added projects (${diff.added.length}): ${diff.added.map(s => s.project).join(", ") || "none"}`,
      `Deleted projects (${diff.deleted.length}): ${diff.deleted.map(s => s.project).join(", ") || "none"}`,
      `Updated projects (${diff.updated.length}):`,
      ...diff.updated.map(u => `  - ${u.snapshot.project}: ${u.changes.join("; ") || "minor change"}`),
      `Currently delayed projects: ${riskContext.delayedProjectNames.join(", ") || "none"}`,
      `Currently delayed tasks/to-dos: ${riskContext.delayedTaskCount}`,
      `Projects by phase right now: completed ${riskContext.completed}, in progress ${riskContext.inProgress}, upcoming kick-off ${riskContext.upcoming}, exploration ${riskContext.exploration}`
    ];
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 700,
        system: "You are a delivery-management assistant writing a concise weekly status analysis for one delivery stream. Respond ONLY with a single valid JSON object, no markdown fences, no preamble, matching exactly this shape: {\"summary\": string, \"needsAttention\": string[], \"highlights\": string[]}. \"summary\" is 2-4 sentences on what changed this period. \"needsAttention\" lists short, specific items that need to be unlocked, escalated, or decided on (blockers, overdue items, stalled projects) — empty array if none. \"highlights\" lists short, specific notable wins or important shifts worth calling out — empty array if none. Keep every bullet under 20 words.",
        messages: [{ role: "user", content: promptLines.join("\n") }]
      })
    });
    const data = await response.json();
    const text = (data.content || []).map(c => c.text || "").join("");
    const clean = text.replace(/```json|```/g, "").trim();
    const parsed = JSON.parse(clean);
    return {
      summary: parsed.summary || fallback.summary,
      needsAttention: Array.isArray(parsed.needsAttention) ? parsed.needsAttention : fallback.needsAttention,
      highlights: Array.isArray(parsed.highlights) ? parsed.highlights : fallback.highlights
    };
  } catch (err) {
    return fallback;
  }
}

function DashboardReportView({ projectList, records, currentUser, weeklyReports, onSaveWeeklyReports }) {
  const todayISO = new Date().toISOString().slice(0,10);
  const [generating, setGenerating] = useState(false);
  const canGenerate = !!(currentUser && currentUser.role === "superAdmin");

  const projectStats = useMemo(() => {
    return (projectList || []).map(row => {
      const key = makeKey(row.application, row.project);
      const rec = records[key] || {};
      const tasks = rec.tasks || [], todos = rec.todos || [];
      const progress = computeTimelineProgress(tasks, todos);
      const completed = isCompletedPhase(row.phase);
      let riskLabel = null;
      if (row.endDate && !completed) {
        const daysDiff = Math.round((new Date(row.endDate + "T00:00:00") - new Date(todayISO + "T00:00:00")) / 86400000);
        if (daysDiff < 0) riskLabel = `Overdue by ${Math.abs(daysDiff)} day${Math.abs(daysDiff) === 1 ? "" : "s"}`;
      }
      return { row, progress, completed, riskLabel, tasks, todos };
    });
  }, [projectList, records, todayISO]);

  const overall = useMemo(() => {
    const totalProjects = projectStats.length;
    const completedCount = projectStats.filter(ps => ps.completed).length;
    const completedPct = totalProjects ? Math.round((completedCount / totalProjects) * 100) : 0;
    return {
      totalProjects,
      pct: completedPct,
      delayedCount: projectStats.filter(ps => ps.riskLabel).length,
      completedCount,
      completedPct
    };
  }, [projectStats]);

  const streamReports = useMemo(() => {
    const groups = {};
    projectStats.forEach(ps => {
      const s = norm(ps.row.stream) || "(No Stream)";
      (groups[s] = groups[s] || []).push(ps);
    });
    const phaseCode = ps => { const m = norm(ps.row.phase).match(/^(\d+)/); return m ? m[1] : null; };
    const isDelayedItem = (item, dateField) => {
      const d = item[dateField];
      if (!d || d >= todayISO) return false;
      const st = norm(item.status).toLowerCase();
      return st !== "done" && st !== "cancelled";
    };
    return Object.entries(groups).map(([streamName, items]) => {
      const total = items.length;
      const completed = items.filter(ps => isCompletedPhase(ps.row.phase)).length;
      const inProgress = items.filter(ps => ["3","4","5"].includes(phaseCode(ps))).length;
      const upcoming = items.filter(ps => ["1","2"].includes(phaseCode(ps))).length;
      const exploration = items.filter(ps => phaseCode(ps) === "0").length;
      const pct = n => total ? Math.round((n / total) * 100) : 0;
      const isDoneItem = t => norm(t.status).toLowerCase() === "done";
      const delayedTaskCount = items.reduce((sum, ps) => sum + ps.tasks.filter(t => isDelayedItem(t, "endDate")).length, 0)
        + items.reduce((sum, ps) => sum + ps.todos.filter(t => isDelayedItem(t, "dueDate")).length, 0);
      const completedTaskCount = items.reduce((sum, ps) => sum + ps.tasks.filter(isDoneItem).length, 0)
        + items.reduce((sum, ps) => sum + ps.todos.filter(isDoneItem).length, 0);
      return {
        streamName, projectCount: total,
        completed, inProgress, upcoming, exploration, total,
        pctCompleted: pct(completed), pctInProgress: pct(inProgress), pctUpcoming: pct(upcoming), pctExploration: pct(exploration),
        overallPct: pct(completed),
        atRisk: items.filter(ps => ps.riskLabel),
        delayedTaskCount, completedTaskCount
      };
    }).sort((a, b) => a.streamName.localeCompare(b.streamName));
  }, [projectStats, todayISO]);

  const handleGenerateReport = async () => {
    if (generating || streamReports.length === 0) return;
    setGenerating(true);
    try {
      const generatedDate = new Date().toISOString().slice(0,10);
      const newReports = [];
      for (const sr of streamReports) {
        const items = projectStats.filter(ps => (norm(ps.row.stream) || "(No Stream)") === sr.streamName);
        const currSnapshots = items.map(ps => buildProjectSnapshot(ps.row, records));
        const prevForStream = weeklyReports
          .filter(r => r.stream === sr.streamName)
          .sort((a, b) => b.generatedDate.localeCompare(a.generatedDate));
        const prevSnapshots = prevForStream.length ? prevForStream[0].snapshots : [];
        const diff = diffStreamSnapshots(prevSnapshots, currSnapshots);
        const riskContext = {
          delayedProjectNames: sr.atRisk.map(ps => ps.row.project || "Untitled"),
          delayedTaskCount: sr.delayedTaskCount,
          completed: sr.completed, inProgress: sr.inProgress, upcoming: sr.upcoming, exploration: sr.exploration
        };
        const aiAnalysis = await generateStreamAiAnalysis(sr.streamName, diff, riskContext);
        newReports.push({
          id: uid(), generatedDate, stream: sr.streamName, generatedBy: currentUser ? currentUser.email : "",
          diffSummary: {
            addedCount: diff.added.length, updatedCount: diff.updated.length, deletedCount: diff.deleted.length,
            added: diff.added.map(s => s.project || "Untitled"),
            deleted: diff.deleted.map(s => s.project || "Untitled"),
            updated: diff.updated.map(u => ({ project: u.snapshot.project || "Untitled", changes: u.changes }))
          },
          aiAnalysis,
          snapshots: currSnapshots
        });
      }
      onSaveWeeklyReports(newReports);
    } finally {
      setGenerating(false);
    }
  };

  return h("div", { style:{ maxWidth:1500, margin:"0 auto", padding:"28px 28px 48px" } },
    h("div", { style:{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", flexWrap:"wrap", gap:12, marginBottom:20 } },
      h("div", null,
        h("h1", { style:{ fontSize:22, fontWeight:700, color:"#152238", margin:0 } }, "Dashboard Report"),
        h("p", { style:{ fontSize:13, color:"#64748B", margin:"4px 0 0" } }, "High-level progress overview across all streams \u2014 completion, in-progress work, and delivery risk.")
      ),
      canGenerate && h("button", {
        className:"btn btn-primary", onClick:handleGenerateReport, disabled:generating || projectStats.length === 0
      }, generating ? "Generating\u2026" : "Generate Report")
    ),

    projectStats.length === 0
      ? h("div", { className:"card", style:{ padding:"48px 0", textAlign:"center", color:"#94A3B8", fontSize:13 } }, "No projects yet. Add one via the \"Create Project\" menu.")
      : h("div", null,
          h("div", { style:{ display:"flex", flexWrap:"wrap", gap:14, marginBottom:20 } },
            h(StatCard, { label:"Total Projects", value:overall.totalProjects }),
            h(StatCard, { label:"Overall Progress", value:`${overall.pct}%`, color: overall.pct === 100 ? "#166534" : "#1E3A5F", sub:"% of projects at Phase 6/60/61/62" }),
            h(StatCard, { label:"Delayed Projects", value:overall.delayedCount, color: overall.delayedCount > 0 ? "#C2410C" : "#166534", sub: overall.delayedCount > 0 ? "Past End Date, not yet at Phase 6/60/61/62" : "None right now" }),
            h(StatCard, { label:"Completed Projects", value:`${overall.completedPct}%`, color:"#166534", sub:"% of projects at Phase 6/60/61/62" })
          ),

          streamReports.map(sr => h("div", { key:sr.streamName, className:"card", style:{ marginBottom:16 } },
            h("div", { style:{ display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:10, marginBottom:10 } },
              h("div", null,
                h("div", { style:{ fontSize:15, fontWeight:700, color:"#152238" } }, sr.streamName),
                h("div", { style:{ fontSize:12, color:"#64748B", marginTop:2 } }, `${sr.projectCount} project${sr.projectCount === 1 ? "" : "s"}`)
              ),
              h("div", { style:{ fontSize:18, fontWeight:800, color: sr.overallPct === 100 ? "#166534" : "#1E3A5F" } }, `${sr.overallPct}%`)
            ),

            h("div", { style:{ height:8, borderRadius:6, background:"#E2E8F0", overflow:"hidden", display:"flex", marginBottom:10 } },
              sr.total > 0 && h("div", { style:{ height:"100%", width:`${sr.pctCompleted}%`, background:"#22C55E" } }),
              sr.total > 0 && h("div", { style:{ height:"100%", width:`${sr.pctInProgress}%`, background:"#4F9D9D" } }),
              sr.total > 0 && h("div", { style:{ height:"100%", width:`${sr.pctUpcoming}%`, background:"#60A5FA" } }),
              sr.total > 0 && h("div", { style:{ height:"100%", width:`${sr.pctExploration}%`, background:"#CBD5E1" } })
            ),
            h("div", { style:{ display:"flex", gap:14, flexWrap:"wrap", fontSize:12, color:"#64748B", marginBottom:12 } },
              h("span", null, h("span", { style:{ color:"#22C55E", fontWeight:700 } }, "\u25CF "), `Completed Projects ${sr.pctCompleted}% (${sr.completed})`),
              h("span", null, h("span", { style:{ color:"#4F9D9D", fontWeight:700 } }, "\u25CF "), `In Progress ${sr.pctInProgress}% (${sr.inProgress})`),
              h("span", null, h("span", { style:{ color:"#60A5FA", fontWeight:700 } }, "\u25CF "), `Upcoming Kick Off ${sr.pctUpcoming}% (${sr.upcoming})`),
              h("span", null, h("span", { style:{ color:"#94A3B8", fontWeight:700 } }, "\u25CF "), `Exploration ${sr.pctExploration}% (${sr.exploration})`)
            ),

            h("div", { style:{ display:"flex", flexWrap:"wrap", gap:16, marginBottom:12, fontSize:12 } },
              h("span", { style:{ color:"#166534", fontWeight:600 } }, `Completed Tasks: ${sr.completedTaskCount}`),
              h("span", { style:{ color: sr.delayedTaskCount > 0 ? "#C2410C" : "#64748B", fontWeight:600 } }, `Delayed Tasks: ${sr.delayedTaskCount}`)
            ),

            h("div", { style:{ borderTop:"1px solid #F1F5F9", paddingTop:10 } },
              h("div", { style:{ fontSize:12, fontWeight:700, color: sr.atRisk.length > 0 ? "#C2410C" : "#166534", marginBottom: sr.atRisk.length > 0 ? 6 : 0 } },
                sr.atRisk.length > 0 ? `\u26A0 ${sr.atRisk.length} project${sr.atRisk.length === 1 ? "" : "s"} delayed` : "\u2713 No delayed projects"
              ),
              sr.atRisk.length > 0 && h("div", { style:{ display:"flex", flexDirection:"column", gap:5 } },
                sr.atRisk.map(ps => h("div", { key:ps.row.id, style:{ fontSize:12, color:"#334155", display:"flex", justifyContent:"space-between", gap:10, flexWrap:"wrap" } },
                  h("span", null, `${ps.row.project || "\u2014"} `, h("span", { style:{ color:"#94A3B8" } }, `(${ps.row.application || "\u2014"})`)),
                  h("span", { style:{ color:"#C2410C", fontWeight:600 } }, ps.riskLabel)
                ))
              )
            )
          ))
        )
  );
}
